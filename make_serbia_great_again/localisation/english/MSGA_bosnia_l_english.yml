l_english:
 MSGA_start_make_serbia_great_again:0 "Start Making Serbia Great Again"
 MSGA_start_make_serbia_great_again_desc:0 "The government presents its revanchist programme to the nation, placing the grievances of Yugoslavia, Kosovo and NATO at the centre of its foreign policy."
 MSGA_start_mobilising_our_people:0 "Start Mobilising Our People"
 MSGA_start_mobilising_our_people_desc:0 "Organise public meetings and prepare the country for the burdens of a more confrontational policy."
 MSGA_strengthen_national_narrative:0 "Strengthen the National Narrative"
 MSGA_strengthen_national_narrative_desc:0 "Bring the government's national message into schools, television studios and municipal halls."
 MSGA_one_people_across_the_drina:0 "One People Across the Drina"
 MSGA_one_people_across_the_drina_desc:0 "The regime invokes kinship across the Drina to expand recruitment and turn attention towards Serbian communities in Bosnia."
 MSGA_prepare_the_nation_for_war:0 "Prepare the Nation for War"
 MSGA_prepare_the_nation_for_war_desc:0 "Prepare civil institutions and local commanders to defend Serbian core territory. Public mobilisation reaches its final stage."
 MSGA_establish_territorial_defence:0 "Establish the Territorial Defence"
 MSGA_establish_territorial_defence_desc:0 "Form one editable three-battalion militia division in Belgrade and authorise paid, one-time regional formations."
 MSGA_start_the_army_buildup:0 "Start the Army Buildup"
 MSGA_start_the_army_buildup_desc:0 "A 200-day procurement programme reduces the production cost of infantry weapons, APCs, IFVs and main battle tanks while increasing expenses and military factory upkeep."
 MSGA_buy_equipment_serbian_air_force:0 "Buy Equipment for the Serbian Air Force"
 MSGA_buy_equipment_serbian_air_force_desc:0 "Choose a $15B Russian package of 50 Su-30s, 25 Su-24s and 50 Mi-24s, or a $10B Chinese package of 40 J-16s and 30 Z-10s. Procurement must actually be funded before final preparations."
 MSGA_spend_money_command_structure:0 "Spend Money on the Command Structure"
 MSGA_spend_money_command_structure_desc:0 "Improve staff training, secure communications and the army's ability to accumulate Command Power."
 MSGA_prepare_logistics_network:0 "Prepare the Logistics Network"
 MSGA_prepare_logistics_network_desc:0 "Deliver fifteen trains and 150 utility vehicles to the stockpile, preparing the transport network for sustained operations."
 MSGA_prepare_for_the_unthinkable:0 "Prepare for the Unthinkable"
 MSGA_prepare_for_the_unthinkable_desc:0 "Complete operational preparations after the air purchase, command reform and logistics deliveries. Reduce the base stability cost of war and improve planning, attack and breakthrough."
 MSGA_seed_the_rebellion_in_bosnia:0 "Seed the Rebellion in Bosnia"
 MSGA_seed_the_rebellion_in_bosnia_desc:0 "Support a separatist proclamation in TFR's existing Srpska core states. Three weak militia divisions will defend the new republic; Bosnia will declare war fifteen days after its release."
 MSGA_watch_the_conflict:0 "Watch the Conflict"
 MSGA_watch_the_conflict_desc:0 "Observe the Bosnia-Srpska war for seventy days. Serbia might need to intervene. Once this observation ends, actual territorial losses in Srpska will bring the next decision to Belgrade."
 MSGA_drina_mobilisation:0 "One People Across the Drina"
 MSGA_drina_mobilisation_desc:0 "The regime links recruitment to its campaign about Serbian communities abroad."
 MSGA_home_defence:0 "Prepared Home Defence"
 MSGA_home_defence_desc:0 "Civil defence and military preparations strengthen divisions defending Serbian core territory."
 MSGA_command_structure:0 "Reformed Command Structure"
 MSGA_command_structure_desc:0 "Training and secure communications improve Command Power gain."
 MSGA_serbian_rearmament_program:0 "Serbian Rearmament Program"
 MSGA_serbian_rearmament_program_desc:0 "For 200 days, infantry weapons, APCs, IFVs and main battle tanks cost 25% less to produce. Monthly expense growth rises by 15%, and military factory upkeep by 5%."
 MSGA_prepared_for_war:0 "Prepared for War"
 MSGA_prepared_for_war_desc:0 "War planning reduces the base stability penalty from war by 30% (from -20% to -14%). TFR's separate war-support penalty still applies. Planning, breakthrough and division attack improve."
 MSGA_SRP_last_stand:0 "Last Stand: Republika Srpska"
 MSGA_SRP_last_stand_desc:0 "Resistance continues until almost all meaningful core territory is occupied. The surrender threshold is capped at 99%; this grants no combat bonuses and ends with the conflict."
 MSGA_KOS_last_stand:0 "Last Stand: Kosovo"
 MSGA_KOS_last_stand_desc:0 "Losing Pristina alone need not end the campaign. Resistance continues until almost all meaningful core territory is occupied, with a maximum surrender threshold of 99%. Removed when the campaign ends."
 MSGA_form_territorial_45:0 "Form the Vojvodina Territorial Defence"
 MSGA_form_territorial_45_desc:0 "Pay $0.5B to form one Territorial Defence Militia division in Vojvodina after fourteen days. The editable template begins with exactly three plain militia battalions. Ownership and control are checked again on delivery; a lost state refunds the payment. Each successful formation is unique."
 MSGA_form_territorial_108:0 "Form the Eastern Serbia Territorial Defence"
 MSGA_form_territorial_108_desc:0 "Pay $0.5B to form one Territorial Defence Militia division in Eastern Serbia after fourteen days. The editable template begins with exactly three plain militia battalions. Ownership and control are checked again on delivery; a lost state refunds the payment. Each successful formation is unique."
 MSGA_form_territorial_1296:0 "Form the Šumadija and Western Serbia Territorial Defence"
 MSGA_form_territorial_1296_desc:0 "Pay $0.5B to form one Territorial Defence Militia division in Šumadija and Western Serbia after fourteen days. The editable template begins with exactly three plain militia battalions. Ownership and control are checked again on delivery; a lost state refunds the payment. Each successful formation is unique."
 MSGA_form_territorial_785:0 "Form the Kosovo Territorial Defence"
 MSGA_form_territorial_785_desc:0 "Pay $0.5B to form one Territorial Defence Militia division in Kosovo after fourteen days. The editable template begins with exactly three plain militia battalions. Ownership and control are checked again on delivery; a lost state refunds the payment. Each successful formation is unique."
 MSGA_form_territorial_1305:0 "Form the Northern Kosovo Territorial Defence"
 MSGA_form_territorial_1305_desc:0 "Pay $0.5B to form one Territorial Defence Militia division in Northern Kosovo after fourteen days. The editable template begins with exactly three plain militia battalions. Ownership and control are checked again on delivery; a lost state refunds the payment. Each successful formation is unique."
 MSGA_territorial_defence_forces:0 "Territorial Defence Forces"
 MSGA_territorial_defence_forces_desc:0 "Regional militia formations require $0.5B and fourteen days. Belgrade already received its unit from the establishing focus. Air procurement can also be resumed here after the treasury recovers."
 MSGA_cost_half_B:0 "§Y$0.5B§!"
 MSGA_territorial_defence_tt:0 "Unlocks an editable template of exactly §Y3 plain militia battalions§!, creates §Y1 division in Belgrade§!, and enables one paid regional formation per eligible core state."
 MSGA_reopen_air_procurement:0 "Resume Air Force Procurement"
 MSGA_reopen_air_procurement_desc:0 "Reopen the supplier offers once at least $10B is available. The selected package is charged once, and the final preparation focus remains locked until equipment is delivered."
 MSGA_bosnia.1.t:0 "Start Making Serbia Great Again"
 MSGA_bosnia.1.d:0 "In its address to the nation, the government lays out a revanchist political narrative: it argues that Yugoslavia's breakup left Serbian communities beyond Serbia, that the wars weakened the country, and that Kosovo and NATO's intervention remain unresolved grievances. The leadership portrays Washington and NATO as principal adversaries and claims that protecting or reunifying Serbs abroad requires a confrontational foreign policy. These are the regime's arguments for its coming programme, not an impartial account of the past."
 MSGA_bosnia.1.a:0 "We have entered a new phase."
 MSGA_bosnia.2.t:0 "Mobilising the Public"
 MSGA_bosnia.2.d:0 "Public meetings and government broadcasts tell citizens to prepare for sacrifices. Officials link support for the state to readiness for an uncertain confrontation beyond its borders."
 MSGA_bosnia.2.a:0 "We have entered a new phase."
 MSGA_bosnia.3.t:0 "A Single National Message"
 MSGA_bosnia.3.d:0 "The regime brings its account of national grievances to classrooms, municipal halls and television studios. Bosnia now occupies a larger place in the government's rhetoric about Serbian communities abroad."
 MSGA_bosnia.3.a:0 "We have entered a new phase."
 MSGA_bosnia.4.t:0 "An Air Force Supplier"
 MSGA_bosnia.4.d:0 "Russian suppliers offer 50 Su-30 fighters, 25 Su-24 strike aircraft and 50 Mi-24 attack helicopters for $15B. China offers 40 J-16 fighters and 30 Z-10 attack helicopters for $10B. The cheaper offer is smaller and contains no separate strike-aircraft group. Payment comes directly from the treasury; if funds are insufficient, the offers can be reopened through Territorial Defence Forces."
 MSGA_bosnia.4.a:0 "Russian package — $15B"
 MSGA_bosnia.4.b:0 "Chinese package — $10B"
 MSGA_bosnia.4.c:0 "Defer until the treasury can fund the purchase."
 MSGA_bosnia.5.t:0 "An Air Force Supplier"
 MSGA_bosnia.5.d:0 "Russian suppliers offer 50 Su-30 fighters, 25 Su-24 strike aircraft and 50 Mi-24 attack helicopters for $15B. China offers 40 J-16 fighters and 30 Z-10 attack helicopters for $10B. The cheaper offer is smaller and contains no separate strike-aircraft group. Payment comes directly from the treasury; if funds are insufficient, the offers can be reopened through Territorial Defence Forces."
 MSGA_bosnia.5.a:0 "Russian package — $15B"
 MSGA_bosnia.5.b:0 "Chinese package — $10B"
 MSGA_bosnia.5.c:0 "Defer until the treasury can fund the purchase."
 MSGA_bosnia.6.t:0 "The Republika Srpska Uprising"
 MSGA_bosnia.6.d:0 "With covert support from Belgrade, Bosnian Serb leaders proclaim Republika Srpska in Northern Srpska, Eastern Srpska and Brčko, the existing territories defined in the TFR scenario. Milorad Dodik heads the administration. Its three poorly trained militia divisions are no match for Bosnia's regular formations. Sarajevo refuses to recognise the secession."
 MSGA_bosnia.6.a:0 "The frontier has changed; the risk has not."
 MSGA_bosnia.8.t:0 "Bosnia Declares War"
 MSGA_bosnia.8.d:0 "Sarajevo has ordered its forces to restore its authority over Northern Srpska, Eastern Srpska and Brčko. The secession has become an open war."
 MSGA_bosnia.8.a:0 "Observe the fighting."
 MSGA_bosnia.9.t:0 "Serbia Enters the War"
 MSGA_bosnia.9.d:0 "Belgrade declares that it cannot remain neutral while Republika Srpska fights for survival. Serbia will establish the Serbian Alliance, admit Srpska and enter its existing war against Sarajevo."
 MSGA_bosnia.9.a:0 "Establish the alliance and enter the war."
