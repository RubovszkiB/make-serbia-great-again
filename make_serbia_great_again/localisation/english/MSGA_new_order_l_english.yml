l_english:
 MSGA_regularise_croatia:0 "Regularise the Croatian Administration"
 MSGA_regularise_croatia_desc:0 "Negotiate an administrative framework with Croatian Administration. Cost: 25 Political Power. Duration: 10 days. Only one client-state process can run at a time. The country remains a Serbian subject. Completion grants it 10% stability, +25 opinion of Serbia and a modest 50-point autonomy-progress reduction. If the client ceases to exist or leaves Serbian protection, the process is cancelled without rewards or a completion flag."
