 MSGA_consolidate_the_serbian_sphere:0 "Consolidate the Serbian Sphere"
 MSGA_consolidate_the_serbian_sphere_desc:0 "Military victory alone cannot create a permanent regional order. Each surviving Balkan client administration must formalise its relationship with Belgrade. Each process costs 25 PP and takes 10 days; only one can run at a time. Existing country borders and subject status are preserved."
 MSGA_regularisation_duration_tt:0 "Administrative negotiations take §Y10 days§!. Other client-state decisions remain unavailable until this process ends."
 MSGA_regularisation_autonomy_tt:0 "Administrative consolidation"
 MSGA_stabilised_subjects_tt:0 "Relevant Balkan subjects: §G−10%§! autonomy gain. Applied to each subject administration."
 MSGA_cost_of_victory_i:0 "The Cost of Victory"
 MSGA_cost_of_victory_i_desc:0 "The post-war economy carries the cost of victory. Recovery stage 1 of 4. Reconstruction gradually removes the emergency penalties; the additional $15 billion national debt remains."
 MSGA_cost_of_victory_ii:0 "The Cost of Victory II"
 MSGA_cost_of_victory_ii_desc:0 "The post-war economy carries the cost of victory. Recovery stage 2 of 4. Reconstruction gradually removes the emergency penalties; the additional $15 billion national debt remains."
 MSGA_cost_of_victory_iii:0 "The Cost of Victory III"
 MSGA_cost_of_victory_iii_desc:0 "The post-war economy carries the cost of victory. Recovery stage 3 of 4. Reconstruction gradually removes the emergency penalties; the additional $15 billion national debt remains."
 MSGA_cost_of_victory_iv:0 "The Cost of Victory IV"
 MSGA_cost_of_victory_iv_desc:0 "The post-war economy carries the cost of victory. Recovery stage 4 of 4. Reconstruction gradually removes the emergency penalties; the additional $15 billion national debt remains."
 MSGA_a_stabilised_balkan_order:0 "A Stabilised Balkan Order"
 MSGA_a_stabilised_balkan_order_desc:0 "A functioning Serbian regional framework supports stability, political administration and monthly income growth. Its Balkan client administrations receive a modest autonomy-gain penalty. National debt is unchanged."
 MSGA_serbian_commerce_restored:0 "Serbian Commerce Restored"
 MSGA_serbian_commerce_restored_desc:0 "Commercial activity returns to normal operation. Native TFR Business Value increases by 5% and Monthly Income Growth by 3%."
 MSGA_reconstruction_authority:0 "Reconstruction Authority"
 MSGA_reconstruction_authority_desc:0 "A temporary 120-day programme coordinates industrial repair. It ends early when the new order is stabilised."
 MSGA_stabilised_client_order:0 "A Stabilised Client Administration"
 MSGA_stabilised_client_order_desc:0 "The established administrative framework reduces this Balkan subject’s autonomy gain by 10%. It ends if the country ceases to be a Serbian subject."
 MSGA_count_the_cost:0 "Count the Cost"
 MSGA_count_the_cost_desc:0 "Assess the cost of victory. The additional $15 billion national debt was charged by the victory event and is not charged again."
 MSGA_begin_reconstruction:0 "Begin Reconstruction"
 MSGA_begin_reconstruction_desc:0 "Add five percentage points to native TFR industrial-development progress, establish a temporary repair authority and open the parallel client-state decisions."
 MSGA_repair_the_roads_and_railways:0 "Repair the Roads and Railways"
 MSGA_repair_the_roads_and_railways_desc:0 "Restore capped infrastructure in Vojvodina, Belgrade and Sumadija and raise two verified Serbian railway corridors to at least level three. Add five points to TFR industrial-development progress."
 MSGA_restore_serbian_industry:0 "Restore Serbian Industry"
 MSGA_restore_serbian_industry_desc:0 "Add one civilian and one military factory to controlled Serbia, with the required building slots, and five points to TFR industrial-development progress."
 MSGA_restart_serbian_commerce:0 "Restart Serbian Commerce"
 MSGA_restart_serbian_commerce_desc:0 "Restore native TFR Business Value and Monthly Income Growth, add an Office Park and five points to industrial-development progress."
 MSGA_stabilise_the_new_order:0 "Stabilise the New Order"
 MSGA_stabilise_the_new_order_desc:0 "Complete all three economic programmes and regularise every current Balkan subject. After the Conference of Belgrade, stabilise at peace and remove all Cost of Victory stages. Debt remains."
 MSGA_the_south_slavic_question:0 "The South Slavic Question"
 MSGA_the_south_slavic_question_desc:0 "Open the political discussion among the South Slavic administrations around Serbia. Albania remains a separate Balkan client outside this project. No territorial integration occurs."
 MSGA_south_slavic_unity:0 "South Slavic Unity"
 MSGA_south_slavic_unity_desc:0 "Open the gateway to a future political chapter. The eventual structure remains undecided; this focus changes no borders, country tags or subject status."
 MSGA_neworder.1.t:0 "Victory in the Balkan War"
 MSGA_neworder.1.d:0 "The last organised resistance of the Zagreb–Tirana Pact has ended. Governments that once gathered to contain Serbia now stand within Belgrade’s political orbit. From Ljubljana to Skopje and from Zagreb to Tirana, the regional balance has been rewritten.\n\nVictory has come at an extraordinary price. Mobilisation, emergency borrowing and the administration of defeated states have left Serbia with heavy debts and an exhausted civilian economy. Winning the war was only the beginning."
 MSGA_neworder.1.a:0 "Now we must pay for victory."
 MSGA_neworder.2.t:0 "The Bill Comes Due"
 MSGA_neworder.2.d:0 "The first complete financial assessment of the war has reached Belgrade. Emergency procurement, mobilisation, reconstruction loans and military logistics have created obligations far beyond pre-war expectations.\n\nThe military campaign has ended. The financial campaign is only beginning."
 MSGA_neworder.2.a:0 "There was never going to be a cheap victory."
 MSGA_neworder.3.t:0 "The Reconstruction Authority"
 MSGA_neworder.3.d:0 "The government has established a central Reconstruction Authority to coordinate repairs to roads, railways, industrial facilities, power networks and public infrastructure.\n\nEvery ministry is demanding priority. Belgrade must rebuild the civilian economy while continuing to service the debts created by victory."
 MSGA_neworder.3.a:0 "Rebuild what the war consumed."
 MSGA_neworder.4.t:0 "The Arteries of Serbia"
 MSGA_neworder.4.d:0 "The principal road and rail corridors strained by mobilisation are returning to regular service. Freight is moving again, civilian traffic has resumed and the interior is being reconnected to Belgrade.\n\nReconstruction remains incomplete, but the arteries of the Serbian economy are beginning to function again."
 MSGA_neworder.4.a:0 "Keep the trains moving."
 MSGA_neworder.5.t:0 "The Furnaces Burn Again"
 MSGA_neworder.5.d:0 "Production lines that spent years supplying the war effort are being repaired and retooled. Serbian steel, machinery and manufacturing are beginning to recover from the strain of mobilisation.\n\nFactories that once supplied the front must now rebuild the country."
 MSGA_neworder.5.a:0 "Put Serbia back to work."
 MSGA_neworder.6.t:0 "Belgrade Opens for Business"
 MSGA_neworder.6.d:0 "Commercial banks, logistics companies, insurers and regional firms are returning to normal activity. Belgrade’s business districts are looking beyond the battlefield towards the wider Balkan market.\n\nThe scars of war remain, but Serbian commerce is moving again."
 MSGA_neworder.6.a:0 "Open the doors."
 MSGA_neworder.7.t:0 "The Zagreb Accords"
 MSGA_neworder.7.d:0 "Representatives of Belgrade and the Croatian administration have signed a permanent framework for security, foreign policy and administrative cooperation.\n\nCroatia retains its internal institutions. The independent regional policy that created the Zagreb–Tirana Pact has given way to coordination with Serbia."
 MSGA_neworder.7.a:0 "Zagreb has found its place in the new order."
 MSGA_neworder.8.t:0 "The Ljubljana Protocol"
 MSGA_neworder.8.d:0 "The Ljubljana Protocol places Slovenia’s external security and strategic coordination inside the Serbian regional framework. Local institutions retain responsibility for internal administration.\n\nEconomic connections will gradually replace the emergency structures of war."
 MSGA_neworder.8.a:0 "Cooperation will replace occupation."
 MSGA_neworder.9.t:0 "The Podgorica Settlement"
 MSGA_neworder.9.d:0 "Belgrade and Podgorica have formalised the arrangements that followed Montenegro’s defeat. Local institutions continue to function, while foreign and security policy are coordinated with Serbia.\n\nThe emergency military relationship is becoming an established political one."
 MSGA_neworder.9.a:0 "Podgorica returns to Belgrade’s orbit."
 MSGA_neworder.10.t:0 "The Skopje Agreement"
 MSGA_neworder.10.d:0 "Skopje has accepted a permanent framework of security consultation, economic coordination and Serbian strategic leadership.\n\nNorth Macedonia remains a separate state, with its regional policy now firmly tied to Belgrade."
 MSGA_neworder.10.a:0 "The Vardar now lies inside our sphere."
 MSGA_neworder.11.t:0 "The Tirana Arrangement"
 MSGA_neworder.11.d:0 "Relations with Albania remain the most difficult part of the new regional order. Belgrade has formalised a client relationship that leaves Albania’s administration and statehood intact.\n\nTirana’s defence and foreign policy operate within Serbian strategic limits. Kosovo remains Serbian; Albania remains outside the South Slavic political project."
 MSGA_neworder.11.a:0 "Tirana will remain a separate client state."
 MSGA_neworder.12.t:0 "The Sarajevo Framework"
 MSGA_neworder.12.d:0 "The arrangements created after the Bosnian conflict have been incorporated into Serbia’s wider post-war system. Sarajevo’s relationship with Belgrade now rests on an administrative framework rather than emergency measures.\n\nThe existing Bosnian state retains its territory and institutions within the Serbian sphere."
 MSGA_neworder.12.a:0 "Formalise what victory created."
 MSGA_neworder.13.t:0 "The Conference of Belgrade"
 MSGA_neworder.13.d:0 "Representatives from every government in Serbia’s regional sphere have assembled in Belgrade. The administrative arrangements created by war have been formalised through separate agreements.\n\nTrade, defence and diplomatic coordination now rest on an established framework. Economic reconstruction must still be completed before the new order can be stabilised."
 MSGA_neworder.13.a:0 "Order must replace occupation."
 MSGA_neworder.14.t:0 "The Balkans Stabilise"
 MSGA_neworder.14.d:0 "Railways run again, local administrations have established procedures and trade has resumed. The emergency structures of war are being dismantled.\n\nSerbia remains deeply indebted, but the immediate reconstruction crisis has passed. Belgrade can now look beyond recovery and consider what should come next."
 MSGA_neworder.14.a:0 "Now we decide what victory means."
 MSGA_neworder.15.t:0 "The South Slavic Question Returns"
 MSGA_neworder.15.d:0 "For generations, the South Slavic peoples have been divided between competing states, ideologies and visions of unity. Earlier attempts to bring the region together ended in crisis and war.\n\nSerbia now occupies a position Belgrade has not held for decades. Cooperation with Zagreb, Ljubljana, Sarajevo, Podgorica and Skopje can take a new political form. Albania remains a separate Balkan client outside this discussion."
 MSGA_neworder.15.a:0 "We must decide what comes next."
 MSGA_neworder.16.t:0 "The New Balkan Order"
 MSGA_neworder.16.d:0 "The emergency order created by war has survived its first test. Serbia stands at the centre of a regional network stretching from Slovenia to North Macedonia, while the governments of the region coordinate their strategic direction with Belgrade.\n\nThe next question will be political. Serbia has opened the discussion of South Slavic unity; its eventual structure has yet to be decided."
 MSGA_neworder.16.a:0 "The next chapter begins in Belgrade."
 MSGA_neworder.17.t:0 "The Herzegovinian Framework"
 MSGA_neworder.17.d:0 "Belgrade and the Herzegovinian administration have formalised the client relationship established by the Bosnian settlement. Mostar retains its local institutions within Serbia’s regional framework.\n\nHerzegovina remains separate from Bosnia wherever the earlier settlement preserved that arrangement."
 MSGA_neworder.17.a:0 "Regularise the administration in Mostar."
 MSGA_neworder.18.t:0 "The Banja Luka Protocol"
 MSGA_neworder.18.d:0 "The Republika Srpska administration has accepted a permanent framework of consultation and administrative cooperation with Belgrade. Its preserved subject status remains intact.\n\nThis agreement regularises the separate client state. It makes no new territorial or constitutional union with Serbia."
 MSGA_neworder.18.a:0 "Confirm the existing Srpska settlement."
