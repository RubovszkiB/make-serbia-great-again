 MSGA_nuclear_research_bonus:0 "Serbian Civilian Nuclear Research"
 MSGA_econ.1.t:0 "A New Economic Strategy for Serbia"
 MSGA_econ.1.d:0 "Belgrade has brought economic planners, manufacturers and infrastructure specialists around the same table. Recovery must now become a sustained programme of investment rather than a succession of emergency measures.\n\nDomestic projects and cooperation with China, Russia and European partners can strengthen production without placing the country inside a new political bloc. Each programme will be judged by its practical contribution to Serbia."
 MSGA_econ.1.a:0 "Build on the recovery."
 MSGA_econ.2.t:0 "The Morava Corridor Takes Shape"
 MSGA_econ.2.d:0 "New freight connections and improved road access are linking central Serbian workshops to suppliers and customers. The corridor is becoming an economic route as well as a transport project.\n\nIndustry can now plan around more reliable deliveries. Further investment will depend on productive use of these connections rather than another round of announcements."
 MSGA_econ.2.a:0 "Connect our economic centres."
 MSGA_econ.3.t:0 "The Bor Expansion"
 MSGA_econ.3.d:0 "The expanded Bor complex has begun turning investment into dependable industrial capacity. Improved access and modern equipment support extraction, while domestic firms prepare to process a larger share of the output.\n\nThe programme is measured in useful inputs for Serbian industry. Steel and tungsten production provide the campaign economy with a practical representation of that mineral investment."
 MSGA_econ.3.a:0 "Bring the investment into production."
 MSGA_econ.4.t:0 "Serbian Industrial Revival"
 MSGA_econ.4.d:0 "Several permanent projects have now moved beyond the planning stage. Industrial sites, mineral processing and transport investment are beginning to reinforce one another across Serbia.\n\nThe improvement is gradual, but visible. A stronger domestic production base gives the government more room to meet future challenges without relying on temporary economic measures alone."
 MSGA_econ.4.a:0 "The results are becoming visible."
 MSGA_energy.1.t:0 "Powering Serbia's Future"
 MSGA_energy.1.d:0 "The first stage of grid modernisation has been completed. Engineers can now direct further work towards reliable supply, improved connections and the replacement of ageing equipment.\n\nTraditional generation, renewables and a possible civilian nuclear programme will each require careful investment. Modernisation begins with a network capable of supporting them."
 MSGA_energy.1.a:0 "Build a dependable power system."
 MSGA_energy.2.t:0 "A Renewable Partnership with China"
 MSGA_energy.2.d:0 "Serbian and Chinese specialists have completed the opening stage of the Bor renewable project. The partnership combines equipment, engineering support and local work on generation and grid connections.\n\nIts purpose is practical: diversify supply and develop expertise that Serbian firms can use themselves. Additional capacity will follow the same measured investment process."
 MSGA_energy.2.a:0 "Diversify Serbian generation."
 MSGA_energy.3.t:0 "The Nuclear Question"
 MSGA_energy.3.d:0 "Russian technical advisers have joined Serbian planners to examine a peaceful civilian nuclear programme. Their first task is to establish the expertise needed for licensing, research and long-term operation.\n\nAdvice alone cannot build a reactor. Serbia must organise a programme, train a workforce, research the required technology and commit substantial capital before construction can begin."
 MSGA_energy.3.a:0 "Prepare before we build."
 MSGA_energy.4.t:0 "Serbia Enters the Nuclear Age"
 MSGA_energy.4.d:0 "Serbia's first civilian nuclear power plant has entered service. Years of preparation, technical training and concentrated investment have produced a new source of dependable generation.\n\nThe achievement brings lasting responsibilities for operation and maintenance. A second reactor remains a separate project, requiring additional funding and the appropriate native technology."
 MSGA_energy.4.a:0 "A new chapter in Serbian energy."
 MSGA_grid_modernisation_bonus_desc:0 "A Serbian development programme using the native TFR economy and energy system."
 MSGA_nuclear_programme_research_desc:0 "A Serbian development programme using the native TFR economy and energy system."
 MSGA_grid_scale_storage_network_desc:0 "A Serbian development programme using the native TFR economy and energy system."
