l_english:
 MSGA_serbian_economic_cooperation:0 "Serbian Economic Cooperation"
 MSGA_serbian_energy_development:0 "Serbian Energy Development"
 MSGA_serbian_economic_cooperation_desc:0 "Permanent investment in original Serbian territory and measured cooperation with domestic, Chinese, Russian and European industry. Optional development programmes remain available throughout the campaign."
 MSGA_serbian_energy_development_desc:0 "Modernise the Serbian grid, develop renewable generation with China and prepare a civilian nuclear programme with Russian technical support. Native TFR energy buildings remain mutually exclusive within each state."
 MSGA_development_repeatable_tt:0 "Effect lasts 180 days. The programme may be renewed 70 days after the effect expires. It cannot stack with itself."
 MSGA_development_state_free_tt:0 "No other MSGA development project is running in the target state."
 MSGA_development_cancel_tt:0 "If the target is lost or its native building capacity becomes incompatible, the project is cancelled and its Treasury and PP costs are returned. A cancelled project may be restarted."
 MSGA_grid_modernisation_bonus:0 "Serbian Grid Modernisation"
 MSGA_nuclear_programme_research:0 "Serbian Nuclear Research Programme"
 MSGA_grid_scale_storage_network:0 "Serbian Grid-Scale Storage"
 MSGA_expand_bor_mining_complex:0 "Expand the Bor Mining Complex"
 MSGA_expand_bor_mining_complex_desc:0 "One-time investment: $0.5B Treasury. Takes 120 days. +3 Steel, +2 Tungsten; +1 Infrastructure below level 5 (otherwise +1 shared building slot); Industrial Development +0.05. Target: $STATE_108$. Only original 2020 Serbia territory is eligible."
 MSGA_develop_jadar_mining_project:0 "Develop the Jadar Mining Project"
 MSGA_develop_jadar_mining_project_desc:0 "One-time investment: $0.5B Treasury. Takes 120 days. +3 Steel, +2 Tungsten, +1 shared building slot and Industrial Development +0.05. Target: $STATE_1296$. Only original 2020 Serbia territory is eligible."
 MSGA_serbian_mineral_processing_expansion:0 "Serbian Mineral Processing Expansion"
 MSGA_serbian_mineral_processing_expansion_desc:0 "One-time investment: $0.5B Treasury. Takes 120 days. +1 Civilian Factory and +1 shared building slot; Industrial Development +0.03. Target: $STATE_1296$. Only original 2020 Serbia territory is eligible."
 MSGA_central_serbian_industrial_park:0 "Central Serbian Industrial Park"
 MSGA_central_serbian_industrial_park_desc:0 "One-time investment: $0.5B Treasury. Takes 90 days. +1 Civilian Factory and +1 shared building slot around Kragujevac; Industrial Development +0.03. Target: $STATE_1296$. Only original 2020 Serbia territory is eligible."
 MSGA_southern_serbian_industrial_development:0 "Southern Serbian Industrial Development"
 MSGA_southern_serbian_industrial_development_desc:0 "One-time investment: $0.5B Treasury. Takes 90 days. +1 shared building slot and Industrial Development +0.03 around Nis. Complements the earlier southern factory investment. Target: $STATE_108$. Only original 2020 Serbia territory is eligible."
 MSGA_morava_logistics_development:0 "Serbian Logistics and Morava Development"
 MSGA_morava_logistics_development_desc:0 "One-time investment: $0.4B Treasury. Takes 120 days. +1 Infrastructure and +1 shared building slot; Industrial Development +0.025. Requires room below the native infrastructure cap of 5. Target: $STATE_1296$. Only original 2020 Serbia territory is eligible."
 MSGA_modernise_serbian_power_grid:0 "Modernise the Serbian Power Grid"
 MSGA_modernise_serbian_power_grid_desc:0 "One-time investment: $0.4B Treasury. Takes 60 days. +1 Infrastructure below level 5 (otherwise +1 shared building slot); Industrial Development +0.025. For 180 days: Construction Speed +5%, Power Plant and Infrastructure Construction Speed +10%. Target: $STATE_107$. Only original 2020 Serbia territory is eligible."
 MSGA_modernise_nikola_tesla_complex:0 "Modernise the Nikola Tesla Complex"
 MSGA_modernise_nikola_tesla_complex_desc:0 "One-time investment: $0.5B Treasury. Takes 90 days. +1 Power Plant and +1 shared building slot in the Obrenovac region; Industrial Development +0.025. Target: $STATE_1296$. Only original 2020 Serbia territory is eligible."
 MSGA_expand_kostolac_energy_complex:0 "Expand the Kostolac Energy Complex"
 MSGA_expand_kostolac_energy_complex_desc:0 "One-time investment: $0.5B Treasury. Takes 90 days. +1 Power Plant and +1 shared building slot; Industrial Development +0.025. Native TFR rules make this incompatible with Bor renewable generation in Morava. Target: $STATE_108$. Only original 2020 Serbia territory is eligible."
 MSGA_upgrade_djerdap_power_system:0 "Upgrade the Djerdap Power System"
 MSGA_upgrade_djerdap_power_system_desc:0 "One-time investment: $0.4B Treasury. Takes 75 days. +2 native Energy resource from existing hydroelectric generation; +1 Infrastructure below level 5 (otherwise +1 shared building slot); Industrial Development +0.025. No additional Energy Farm is granted. Target: $STATE_108$. Only original 2020 Serbia territory is eligible."
 MSGA_develop_bor_renewable_complex:0 "China: Develop the Bor Renewable Energy Complex"
 MSGA_develop_bor_renewable_complex_desc:0 "One-time investment: $0.5B Treasury. Takes 120 days. +1 Energy Farm and +1 shared building slot; Industrial Development +0.03. Native TFR rules make this incompatible with a Kostolac Power Plant in Morava. Target: $STATE_108$. Only original 2020 Serbia territory is eligible."
 MSGA_expand_bor_renewable_complex:0 "China: Expand the Bor Renewable Complex"
 MSGA_expand_bor_renewable_complex_desc:0 "One-time investment: $0.6B Treasury. Takes 120 days. +1 additional Energy Farm and +1 shared building slot; Industrial Development +0.025. This is the final scripted Energy Farm. Target: $STATE_108$. Only original 2020 Serbia territory is eligible."
 MSGA_establish_serbian_solar_manufacturing:0 "China: Establish Serbian Solar Manufacturing"
 MSGA_establish_serbian_solar_manufacturing_desc:0 "One-time investment: $0.5B Treasury. Takes 90 days. +1 Civilian Factory and +1 shared building slot in Vojvodina; Industrial Development +0.03. No Energy Farm is granted. Target: $STATE_45$. Only original 2020 Serbia territory is eligible."
 MSGA_develop_grid_scale_storage:0 "Develop Grid-Scale Energy Storage"
 MSGA_develop_grid_scale_storage_desc:0 "One-time investment: $0.4B Treasury. Takes 90 days. Permanent Factory Energy Consumption -3%; Industrial Development +0.025. Uses native efficiency rather than a new storage currency. Target: $STATE_107$. Only original 2020 Serbia territory is eligible."
 MSGA_seek_russian_nuclear_expertise:0 "Russia: Seek Russian Nuclear Expertise"
 MSGA_seek_russian_nuclear_expertise_desc:0 "One-time investment: $0.2B Treasury and 50 PP. Takes 60 days. One 50% nuclear research bonus; Academic Development +0.05. Unlocks the nuclear programme and technical assistance; grants no reactor."
 MSGA_establish_serbian_nuclear_programme:0 "Russia: Establish the Serbian Nuclear Programme"
 MSGA_establish_serbian_nuclear_programme_desc:0 "One-time investment: $0.5B Treasury. Takes 120 days. One 50% nuclear research bonus; Academic Development +0.05; Research Speed +3% for 365 days. Unlocks workforce training; grants no reactor."
 MSGA_train_serbian_nuclear_workforce:0 "Russia: Train Serbia's Nuclear Workforce"
 MSGA_train_serbian_nuclear_workforce_desc:0 "One-time investment: $0.3B Treasury. Takes 90 days. One 50% nuclear research bonus; Academic Development +0.05. Unlocks construction after native reactor technology is researched."
 MSGA_first_serbian_nuclear_power_plant:0 "Russia: Begin Construction of Serbia's First Nuclear Power Plant"
 MSGA_first_serbian_nuclear_power_plant_desc:0 "One-time investment: $1.5B Treasury. Takes 180 days. +1 Nuclear Reactor and +1 shared building slot in Vojvodina; Industrial Development +0.05. Requires $nuclear_reactors$ technology and no incompatible energy building. Target: $STATE_45$. Only original 2020 Serbia territory is eligible."
 MSGA_expand_serbian_nuclear_programme:0 "Russia: Expand the Serbian Nuclear Programme"
 MSGA_expand_serbian_nuclear_programme_desc:0 "One-time investment: $1.5B Treasury. Takes 180 days. +1 additional Nuclear Reactor and +1 shared building slot in Vojvodina; Industrial Development +0.025. Requires $nuclear_reactors2$ technology; this is the final scripted reactor. Target: $STATE_45$. Only original 2020 Serbia territory is eligible."
 MSGA_industrial_efficiency_programme:0 "Industrial Efficiency Programme"
 MSGA_industrial_efficiency_programme_desc:0 "Cost: $0.2B Treasury. Production Efficiency Growth +7.5%; Factory Output +2.5%. Effect lasts 180 days. The programme may be renewed 70 days after the effect expires. It cannot stack with itself."
 MSGA_subsidise_serbian_manufacturers:0 "Subsidise Serbian Manufacturers"
 MSGA_subsidise_serbian_manufacturers_desc:0 "Cost: $0.2B Treasury. Factory Output +5%. Effect lasts 180 days. The programme may be renewed 70 days after the effect expires. It cannot stack with itself."
 MSGA_infrastructure_investment_programme:0 "Infrastructure Investment Programme"
 MSGA_infrastructure_investment_programme_desc:0 "Cost: $0.2B Treasury. Construction Speed +5%; Infrastructure Construction Speed +10%. Effect lasts 180 days. The programme may be renewed 70 days after the effect expires. It cannot stack with itself."
 MSGA_support_serbian_businesses:0 "Support Serbian Businesses"
 MSGA_support_serbian_businesses_desc:0 "Cost: $0.2B Treasury. Business Value +4%; native Income Growth +0.5%. Effect lasts 180 days. The programme may be renewed 70 days after the effect expires. It cannot stack with itself."
 MSGA_chinese_industrial_cooperation:0 "China: Chinese Industrial Cooperation"
 MSGA_chinese_industrial_cooperation_desc:0 "Cost: $0.2B Treasury. Factory Output +5%; Civilian Factory Construction Speed +5%. Effect lasts 180 days. The programme may be renewed 70 days after the effect expires. It cannot stack with itself."
 MSGA_chinese_mining_expertise:0 "China: Chinese Mining Expertise"
 MSGA_chinese_mining_expertise_desc:0 "Cost: $0.2B Treasury. Resource Gain +10%; monthly Industrial Development +0.0025. Effect lasts 180 days. The programme may be renewed 70 days after the effect expires. It cannot stack with itself."
 MSGA_chinese_infrastructure_cooperation:0 "China: Chinese Infrastructure Cooperation"
 MSGA_chinese_infrastructure_cooperation_desc:0 "Cost: $0.2B Treasury. Construction Speed +7.5%; Infrastructure Construction Speed +10%. Effect lasts 180 days. The programme may be renewed 70 days after the effect expires. It cannot stack with itself."
 MSGA_chinese_technology_transfer:0 "China: Chinese Technology Transfer"
 MSGA_chinese_technology_transfer_desc:0 "Cost: $0.2B Treasury. Research Speed +3%; monthly Industrial Development +0.0025. Effect lasts 180 days. The programme may be renewed 70 days after the effect expires. It cannot stack with itself."
 MSGA_russian_energy_cooperation:0 "Russia: Russian Energy Cooperation"
 MSGA_russian_energy_cooperation_desc:0 "Cost: $0.2B Treasury. Factory Energy Consumption -3%; Factory Output +3%. Effect lasts 180 days. The programme may be renewed 70 days after the effect expires. It cannot stack with itself."
 MSGA_russian_heavy_industry_cooperation:0 "Russia: Russian Heavy Industry Cooperation"
 MSGA_russian_heavy_industry_cooperation_desc:0 "Cost: $0.2B Treasury. Production Efficiency Growth +5%; Military Factory Construction Speed +5%. Effect lasts 180 days. The programme may be renewed 70 days after the effect expires. It cannot stack with itself."
 MSGA_russian_technological_assistance:0 "Russia: Russian Technological Assistance"
 MSGA_russian_technological_assistance_desc:0 "Cost: $0.2B Treasury. Research Speed +2%; monthly Industrial Development +0.0025. Effect lasts 180 days. The programme may be renewed 70 days after the effect expires. It cannot stack with itself."
 MSGA_european_development_grants:0 "Europe: European Development Grants"
 MSGA_european_development_grants_desc:0 "Cost: 50 PP; no Treasury cost. Business Value +2.5%; monthly Society and Industrial Development +0.002 each. Effect lasts 180 days. The programme may be renewed 70 days after the effect expires. It cannot stack with itself."
 MSGA_european_industrial_standards:0 "Europe: European Industrial Standards"
 MSGA_european_industrial_standards_desc:0 "Cost: $0.2B Treasury. Production Efficiency Growth +5%; Factory Output +3%. Effect lasts 180 days. The programme may be renewed 70 days after the effect expires. It cannot stack with itself."
 MSGA_european_technology_partnership:0 "Europe: European Technology Partnership"
 MSGA_european_technology_partnership_desc:0 "Cost: $0.2B Treasury. Research Speed +3%; monthly Academic Development +0.0025. Effect lasts 180 days. The programme may be renewed 70 days after the effect expires. It cannot stack with itself."
 MSGA_european_business_cooperation:0 "Europe: European Business Cooperation"
 MSGA_european_business_cooperation_desc:0 "Cost: $0.2B Treasury. Business Value +5%; native Income Growth +0.5%. Effect lasts 180 days. The programme may be renewed 70 days after the effect expires. It cannot stack with itself."
 MSGA_chinese_renewable_technology_transfer:0 "China: Chinese Renewable Technology Transfer"
 MSGA_chinese_renewable_technology_transfer_desc:0 "Cost: $0.2B Treasury. Energy Farm Construction Speed +12.5%; Construction Speed +3%; monthly Industrial Development +0.0025. Effect lasts 180 days. The programme may be renewed 70 days after the effect expires. It cannot stack with itself."
 MSGA_renewable_energy_subsidies:0 "Renewable Energy Subsidies"
 MSGA_renewable_energy_subsidies_desc:0 "Cost: $0.2B Treasury. Energy Farm Construction Speed +15%; monthly Industrial Development +0.0025. Effect lasts 180 days. The programme may be renewed 70 days after the effect expires. It cannot stack with itself."
 MSGA_russian_nuclear_technical_assistance:0 "Russia: Russian Nuclear Technical Assistance"
 MSGA_russian_nuclear_technical_assistance_desc:0 "Cost: $0.2B Treasury. Nuclear Reactor Construction Speed +12.5%; Research Speed +2%; monthly Academic Development +0.0025. Effect lasts 180 days. The programme may be renewed 70 days after the effect expires. It cannot stack with itself."
