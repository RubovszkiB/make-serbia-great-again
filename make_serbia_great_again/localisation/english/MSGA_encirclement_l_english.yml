 MSGA_call_up_reserves_desc:0 "Call Up the Reserves. Prepare Serbia for the regional confrontation."
 MSGA_stockpile_continental_war:0 "Stockpile for a Continental War"
 MSGA_stockpile_continental_war_desc:0 "Stockpile for a Continental War. Prepare Serbia for the regional confrontation."
 MSGA_coordinate_protectorates:0 "Coordinate the Protectorates"
 MSGA_coordinate_protectorates_desc:0 "Coordinate the existing Bosnian and Herzegovinian territorial brigades under Serbian command and the logistics of remaining protectorates. No duplicate units will be raised."
 MSGA_serbian_war_plan:0 "The Serbian War Plan"
 MSGA_serbian_war_plan_desc:0 "The Serbian War Plan. Prepare Serbia for the regional confrontation."
 MSGA_break_the_ring:0 "Break the Ring"
 MSGA_break_the_ring_desc:0 "Begin Operation Thunder against all five Zagreb–Tirana Pact members. The opening advantage lasts ten days; later campaign events are outside this chapter."
 MSGA_encirclement.1.t:0 "Podgorica Rejects Belgrade"
 MSGA_encirclement.1.d:0 "Montenegro rejects Belgrade’s demands. Its government insists that sovereignty cannot be bargained away under regional pressure."
 MSGA_encirclement.1.a:0 "They have rejected our approach."
 MSGA_encirclement.2.t:0 "Skopje Refuses Serbian Demands"
 MSGA_encirclement.2.d:0 "North Macedonia refuses Serbia’s demands and seeks partners who share its concern over the changing regional balance."
 MSGA_encirclement.2.a:0 "Skopje has made its choice."
 MSGA_encirclement.3.t:0 "The Calculation Failed"
 MSGA_encirclement.3.d:0 "Neither Podgorica nor Skopje has yielded. Pressure has brought neighbouring governments closer together, while Belgrade must reconsider the assumptions behind its policy."
 MSGA_encirclement.3.a:0 "Prepare for the consequences."
 MSGA_encirclement.4.t:0 "The Balkan States Break with Brussels"
 MSGA_encirclement.4.d:0 "Regional governments no longer consider the Atlantic security framework sufficient to contain the changing Balkan balance. Zagreb, Tirana, Ljubljana, Skopje and Podgorica seek an independent security arrangement."
 MSGA_encirclement.4.a:0 "The region is closing ranks."
 MSGA_encirclement.5.t:0 "The Zagreb–Tirana Pact"
 MSGA_encirclement.5.d:0 "Croatia and Albania have founded a defensive regional alliance with Slovenia, North Macedonia and Montenegro. The Pact pledges to preserve national sovereignty and contain further Serbian expansion."
 MSGA_encirclement.5.a:0 "They have chosen confrontation."
 MSGA_encirclement.6.t:0 "The Pact Mobilises"
 MSGA_encirclement.6.d:0 "All five Pact governments mobilise emergency forces. Motorized formations reinforce Croatia, Albania and Slovenia, while territorial militias prepare to defend each member’s home territory."
 MSGA_encirclement.6.a:0 "The ring is taking shape."
 MSGA_encirclement.7.t:0 "Emergency Measures in Belgrade"
 MSGA_encirclement.7.d:0 "Belgrade expands military production and organises two emergency territorial brigades. Serbia now faces a regional bloc and must prepare its western approaches, southern frontier and home front."
 MSGA_encirclement.7.a:0 "Belgrade will be ready."
 MSGA_encirclement.8.t:0 "The Western Shield"
 MSGA_encirclement.8.d:0 "Roads across the Drina and through the existing protectorates support the western theatre. These preparations use the settlement already established by Serbia."
 MSGA_encirclement.8.a:0 "Keep the western routes open."
 MSGA_encirclement.9.t:0 "Kosovo: The Front Line"
 MSGA_encirclement.9.d:0 "Infrastructure and limited border fortifications prepare Kosovo for a wider regional confrontation. The existing Kosovo brigade remains part of the Serbian force."
 MSGA_encirclement.9.a:0 "Secure the southern approaches."
 MSGA_encirclement.10.t:0 "Serbia Mobilises"
 MSGA_encirclement.10.d:0 "Reservists return to training as Belgrade prepares for a continental struggle. Mobilisation supports the existing army rather than creating an unlimited reserve of men."
 MSGA_encirclement.10.a:0 "Prepare the reserves."
 MSGA_encirclement.11.t:0 "The Allies Take Their Positions"
 MSGA_encirclement.11.d:0 "Serbian command coordinates the existing Bosnian and Herzegovinian territorial formations. Their regional identities remain intact; no duplicate formations are raised. Remaining protectorates align their logistics with Belgrade."
 MSGA_encirclement.11.a:0 "Coordinate the forces already at our disposal."
 MSGA_encirclement.12.t:0 "The First Blow"
 MSGA_encirclement.12.d:0 "Operation Thunder opens against the Zagreb–Tirana Pact. Serbia’s preparations may give the army a brief advantage in the first ten days. What follows will depend on the campaign itself."
 MSGA_encirclement.12.a:0 "Begin Operation Thunder."
 MSGA_pact_diplomatic_independence:0 "Independent Pact Diplomacy"
 MSGA_pact_diplomatic_independence_desc:0 "The Pact conducts its own security policy. Atlantic invitations and AI alliance requests cannot reverse this alignment."
 MSGA_western_preparation:0 "Western Front Preparations"
 MSGA_western_preparation_desc:0 "Temporary staff preparation for the western front."
 MSGA_southern_preparation:0 "Southern Front Preparations"
 MSGA_southern_preparation_desc:0 "Temporary staff preparation for the southern front."
 MSGA_encirclement_reserves:0 "Reservists in Training"
 MSGA_encirclement_reserves_desc:0 "A limited programme accelerates mobilisation and reserve training."
 MSGA_pact_logistics_cooperation:0 "Protectorate Logistics Coordination"
 MSGA_pact_logistics_cooperation_desc:0 "Existing protectorate forces coordinate supply with Serbian command."
 MSGA_operation_thunder:0 "Operation Thunder"
 MSGA_operation_thunder_desc:0 "Staff planning supports the opening operation without granting a permanent attack bonus."
 MSGA_surprise_attack:0 "Surprise Attack"
 MSGA_surprise_attack_desc:0 "The initial operational advantage lasts only ten days."
 MSGA_zagreb_tirana_pact:0 "Zagreb–Tirana Pact"
