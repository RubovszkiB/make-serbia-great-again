l_english:
 MSGA_SER_phase1:0 "Serbia: The Presidency and the Streets"
 MSGA_serbia_in_the_new_decade:0 "A New Decade"
 MSGA_serbia_in_the_new_decade_desc:0 "Belgrade enters 2020 with a familiar president and an unfamiliar horizon. Serbia's room to manoeuvre will depend on a functioning state, a productive economy and the public's willingness to endure another crisis."
 MSGA_contain_the_outbreak:0 "Contain the Outbreak"
 MSGA_contain_the_outbreak_desc:0 "Hospitals need supplies, workers need protection and businesses need a timetable. A limited emergency response can contain disruption without turning every problem into another decree."
 MSGA_reopen_on_serbian_terms:0 "Reopen on Serbian Terms"
 MSGA_reopen_on_serbian_terms_desc:0 "The first shock cannot become a permanent way of life. Reopening must balance hospital capacity, livelihoods and the authority of a government that promised to keep Serbia moving."
 MSGA_attract_productive_capital:0 "Attract Productive Capital"
 MSGA_attract_productive_capital_desc:0 "Contracts matter only when they become jobs, skills and taxable activity. Belgrade will offer a recovery framework for productive capital while retaining control over where scarce public funds go."
 MSGA_upgrade_belgrade_services:0 "Modernise Belgrade Services"
 MSGA_upgrade_belgrade_services_desc:0 "Belgrade's service firms need modern premises, reliable administration and investment beyond the ceremonial ribbon. A funded business district programme will build an Office Park rather than promise one."
 MSGA_develop_the_morava_corridor:0 "Develop the Morava Corridor"
 MSGA_develop_the_morava_corridor_desc:0 "The corridor between Čačak and Kruševac connects industrial towns that cannot prosper on speeches alone. A staged programme will improve the movement of goods through Šumadija and Western Serbia."
 MSGA_independent_resource_policy:0 "An Independent Resource Policy"
 MSGA_independent_resource_policy_desc:0 "Bor's copper, Jadar's prospective lithium and the lignite basins present different choices. Serbia needs investment and credible permits, not a map painted with imaginary deposits."
 MSGA_serbian_recovery:0 "A Recovery Made in Serbia"
 MSGA_serbian_recovery_desc:0 "The recovery will be judged in workshops, offices and household budgets. Domestic firms must be able to compete alongside foreign investors, and every completed programme must deliver more than political theatre."
 MSGA_consolidate_the_state:0 "Consolidate the State"
 MSGA_consolidate_the_state_desc:0 "The presidency depends on ministries capable of carrying out policy. Coordinating the machinery of government is a quieter exercise of power than another campaign rally, but no less consequential."
 MSGA_manage_the_streets:0 "Manage the Streets"
 MSGA_manage_the_streets_desc:0 "Protests cannot be reduced to a statistic. A firm response may restore immediate control, while concessions can preserve trust at a political and financial cost. The presidency must choose what kind of authority it intends to exercise."
 MSGA_presidential_mandate:0 "A Presidential Mandate"
 MSGA_presidential_mandate_desc:0 "Vučić remains at the centre of Serbian politics. A renewed mandate must rest on an administration that can deliver, a public that sees some results and a presidency prepared to bear responsibility for its decisions."
 MSGA_restore_defence_production:0 "Restore Defence Production"
 MSGA_restore_defence_production_desc:0 "The country's defence workshops retain skills that cannot be recreated overnight. Recommissioning capacity in Šumadija will restore one military factory; a second expansion will require a funded commitment."
 MSGA_modernise_the_army:0 "Modernise the Army"
 MSGA_modernise_the_army_desc:0 "Serbia needs units that can communicate, plan and sustain operations. Training and a measured doctrine review will do more for readiness than formations that exist only on paper."
 MSGA_arms_for_an_uncertain_world:0 "Arms for an Uncertain World"
 MSGA_arms_for_an_uncertain_world_desc:0 "Production must build usable reserves before a crisis disrupts suppliers. Improving production routines and paying for a limited procurement package will strengthen the stockpile without multiplying factories for free."
 MSGA_secure_supply_lines:0 "Secure the Supply Lines"
 MSGA_secure_supply_lines_desc:0 "Readiness ends where fuel, spare parts and ammunition stop arriving. Improving Eastern Serbia's infrastructure and tightening supply routines prepares the army for uncertainty across the region."
 MSGA_ready_for_the_uncertain:0 "Ready for the Uncertain"
 MSGA_ready_for_the_uncertain_desc:0 "Staff exercises must expose weaknesses before real operations do. Serbia will review mobilisation plans and improve planning speed, without committing itself to any particular war."
 MSGA_watch_the_western_shield:0 "Watch the Western Shield"
 MSGA_watch_the_western_shield_desc:0 "The American fracture has made old guarantees less certain. Belgrade must assess the military and diplomatic consequences carefully: a distracted Washington does not make every regional gamble safe."
 MSGA_the_kosovo_question:0 "The Kosovo Question"
 MSGA_the_kosovo_question_desc:0 "Kosovo remains the unresolved question at the centre of Serbian strategy. With the state steadier, the army better prepared and the international order fractured, the presidency can commission a crisis review. A decision to fight belongs to the next phase."
 MSGA.1.t:0 "The Presidency Enters a New Decade"
 MSGA.1.d:0 "The cabinet's first briefing of 2020 is familiar: emigration, uneven development and an unresolved question in Kosovo. Vučić intends to keep the initiative. For now, the task is to make the state work, keep the streets from boiling over and prepare for a world that may not remain predictable."
 MSGA.1.a:0 "Begin with what Serbia can control."
 MSGA.2.t:0 "An Emergency Without a Script"
 MSGA.2.d:0 "The first warnings have reached Belgrade. Doctors ask for testing supplies; employers ask how long restrictions will last. The presidency can set the tone, but its credibility will depend on practical decisions over the coming weeks."
 MSGA.2.a:0 "Protect hospitals, workers and essential activity."
 MSGA.3.t:0 "Reopening on Serbian Terms"
 MSGA.3.d:0 "The cabinet must decide how to reopen. A response backed by testing and protected workers can restore confidence. A hurried reopening may win applause today and return the cost to the streets tomorrow."
 MSGA.3.a:0 "Follow a managed reopening."
 MSGA.3.b:0 "Lift restrictions immediately."
 MSGA.4.t:0 "The Streets Answer Back"
 MSGA.4.d:0 "The crowds are not one movement. Some accuse the government of overreach, others of neglect. Security officials want clear instructions; ministers warn that every concession will be read as weakness. Vučić can force the immediate issue or buy space for negotiation."
 MSGA.4.a:0 "Restore order, then defend the decision."
 MSGA.4.b:0 "Open a national dialogue and commit political capital."
 MSGA.5.t:0 "Capital With a Purpose"
 MSGA.5.d:0 "Serbia's recovery programme is open. Service firms, domestic suppliers and the industrial towns each have a claim on public funds. Investment can widen the tax base, but contracts without oversight will simply move money from one set of hands to another."
 MSGA.5.a:0 "Fund projects that can stand on their results."
 MSGA.6.t:0 "Three Partners, One Priority"
 MSGA.6.d:0 "European investors offer access to service markets. Chinese financing offers liquidity for physical works. Russian cooperation offers an easier route to military preparation. Belgrade can continue talking to everyone, but this recovery programme can give priority to only one partner."
 MSGA.6.a:0 "Prioritise European commercial investment."
 MSGA.6.b:0 "Accept Chinese infrastructure financing."
 MSGA.6.c:0 "Expand Russian defence cooperation."
 MSGA.7.t:0 "The Workshops Return to Work"
 MSGA.7.d:0 "Orders have returned to Šumadija's defence workshops. One production line has been restored under the national programme. A further expansion will need money, management and capacity that civilian projects are also competing to obtain."
 MSGA.7.a:0 "Keep the programme measured."
 MSGA.8.t:0 "The Western Shield Cracks"
 MSGA.8.d:0 "Washington's crisis has become a fracture of the American state. European capitals are reassessing assumptions that have guided Balkan security for decades. In Belgrade, the presidency sees room to manoeuvre, while the general staff cautions that uncertainty can endanger Serbia as easily as it can help it."
 MSGA.8.a:0 "Review the new balance carefully."
 MSGA.9.t:0 "A Briefing on Kosovo"
 MSGA.9.d:0 "The cabinet has commissioned a full review of the Kosovo question. Serbia's recovery and readiness programmes have given the presidency more options, and the American fracture has weakened the old framework. Those options now require a crisis policy, diplomatic demands and a careful assessment of escalation. No order for military operations has been issued."
 MSGA.9.a:0 "Prepare the crisis dossier."
 MSGA.10.t:0 "The Programme Delivers"
 MSGA.10.d:0 "Officials have presented the completion report for the funded programme. Its promised asset or economic benefit is now in place. The public commitment has ended, freeing capacity for the next civilian or military investment."
 MSGA.10.a:0 "Publish the accounts and move on."
 MSGA.11.t:0 "The Cost of a Firm Response"
 MSGA.11.d:0 "The immediate confrontation passed, but images of the response have remained in circulation. Opposition organisers have found a common grievance. An earlier national dialogue, if pursued, gives ministers a channel to contain the renewed unrest. Authority won quickly must still be sustained."
 MSGA.11.a:0 "Absorb the political cost."
 MSGA_belgrade_business:0 "Belgrade Business Development"
 MSGA_belgrade_business_desc:0 "Create one Office Park in Belgrade (state 107) and add +1 percentage point to the recovery programme's Business Value bonus. Shared investment slot; construction speed −5% during works.\n\nBudget: £GFX_dx 0.25 billion × (1 + TFR inflation), charged at activation, plus 50 PP. Duration: 90 days. Requires the displayed treasury balance to cover the current quote. Ownership or capacity failure refunds PP and the exact treasury amount paid."
 MSGA_morava_works:0 "Complete the Morava Corridor Works"
 MSGA_morava_works_desc:0 "Complete another infrastructure level in Šumadija and Western Serbia (state 1296) and add +1 percentage point Business Value to the renewed Recovery Programme. Costs 50 PP and £GFX_dx 0.20 billion × (1 + inflation); 120 days. Uses the shared major project slot and temporary construction commitment. Ownership or capacity failure refunds PP and the exact treasury amount paid."
 MSGA_expand_defence:0 "Expand Defence Production"
 MSGA_expand_defence_desc:0 "Build the second Phase 1 military factory in state 1296. This is a one-time funded expansion and competes with civilian projects.\n\nBudget: £GFX_dx 0.35 billion × (1 + TFR inflation), charged at activation, plus 75 PP. Duration: 120 days. Requires the displayed treasury balance to cover the current quote. Ownership or capacity failure refunds PP and the exact treasury amount paid."
 MSGA_bor_modernisation:0 "Modernise the Bor Mining Complex"
 MSGA_bor_modernisation_desc:0 "Fund processing and access improvements around Bor and Majdanpek. Adds +1 percentage point Business Value and one infrastructure level in Eastern Serbia if capacity remains (otherwise +15 PP). Copper is represented economically; no fictitious steel or tungsten deposit.\n\nBudget: £GFX_dx 0.15 billion × (1 + TFR inflation), charged at activation, plus 45 PP. Duration: 120 days. Requires the displayed treasury balance to cover the current quote. Ownership or capacity failure refunds PP and the exact treasury amount paid."
 MSGA_lignite_modernisation:0 "Modernise the Kolubara Lignite Basin"
 MSGA_lignite_modernisation_desc:0 "Improve existing lignite extraction in western Serbia. Completion adds 4 coal in state 1296 using the existing resource abstraction.\n\nBudget: £GFX_dx 0.10 billion × (1 + TFR inflation), charged at activation, plus 40 PP. Duration: 90 days. Requires the displayed treasury balance to cover the current quote. Ownership or capacity failure refunds PP and the exact treasury amount paid."
 MSGA_jadar_survey:0 "Survey the Jadar Basin"
 MSGA_jadar_survey_desc:0 "Commission geological and environmental work in western Serbia. Unlocks a feasibility programme; this does not open a lithium mine.\n\nBudget: £GFX_dx 0.05 billion × (1 + TFR inflation), charged at activation, plus 35 PP. Duration: 180 days. Requires the displayed treasury balance to cover the current quote. Ownership or capacity failure refunds PP and the exact treasury amount paid."
 MSGA_jadar_feasibility:0 "Commission the Jadar Feasibility Programme"
 MSGA_jadar_feasibility_desc:0 "After the survey, fund engineering, environmental assessment and local services. Adds +1 percentage point Business Value; establishes a dossier for future mineral policy. No resource deposit is granted.\n\nBudget: £GFX_dx 0.20 billion × (1 + TFR inflation), charged at activation, plus 40 PP. Duration: 180 days. Requires the displayed treasury balance to cover the current quote. Ownership or capacity failure refunds PP and the exact treasury amount paid."
 MSGA_support_enterprise:0 "Support Serbian Enterprise"
 MSGA_support_enterprise_desc:0 "Fund domestic suppliers and service firms. Costs 40 PP and £GFX_dx 0.10 billion × (1 + inflation). Adds +1 percentage point to the recovery programme's Business Value bonus for its renewed 365-day duration. One time; requires the recovery focus and presidential mandate."
 MSGA_foreign_priority:0 "Choose a Foreign Cooperation Priority"
 MSGA_foreign_priority_desc:0 "Costs 25 PP and £GFX_dx 0.10 billion × (1 + inflation) to arrange a recovery partnership. Choose Europe (+2 points Business Value), China (a £GFX_dx 0.20 billion inflation-adjusted loan with matching debt), or Russia (+10 Army XP and cheaper procurement). One priority for Phase 1."
 MSGA_procure_equipment:0 "Secure Strategic Stocks"
 MSGA_procure_equipment_desc:0 "A one-time 30-day package: 500 basic infantry equipment, 50 support equipment and 3 Army XP. Costs 35 PP and £GFX_dx 0.10 billion × (1 + inflation), or £GFX_dx 0.075 billion with the Russian partnership. No free divisions."
 MSGA_targeted_testing:0 "Targeted Testing"
 MSGA_targeted_testing_desc:0 "Buy test kits and organise targeted screening. Costs 25 PP and £GFX_dx 0.01 billion × (1 + inflation). Completes in 14 days; one response measure and Presidency +0.02. Two completed measures soften Pandemic Disruption and allow a successful managed reopening."
 MSGA_essential_workers:0 "Protect Essential Workers"
 MSGA_essential_workers_desc:0 "Protect key workers with equipment and wage support. Costs 35 PP and £GFX_dx 0.03 billion × (1 + inflation). Completes in 21 days; one response measure and Presidency +0.02. Two completed measures soften Pandemic Disruption and allow a successful managed reopening."
 MSGA_hospital_funding:0 "Emergency Hospital Funding"
 MSGA_hospital_funding_desc:0 "Fund surge capacity and emergency hospital supplies. Costs 35 PP and £GFX_dx 0.05 billion × (1 + inflation). Completes in 14 days; one response measure and Presidency +0.02. Two completed measures soften Pandemic Disruption and allow a successful managed reopening."
 MSGA_medical_assistance:0 "Request Foreign Medical Assistance"
 MSGA_medical_assistance_desc:0 "Request practical medical deliveries while preserving Serbia's wider diplomatic choices. Costs 25 PP. Completes in 14 days; one response measure and Presidency +0.02. Two completed measures soften Pandemic Disruption and allow a successful managed reopening."
 MSGA_SER_streets_presidency_category:0 "Serbian Domestic Affairs"
 MSGA_economic_development:0 "Serbian Economic Development"
 MSGA_rearmament:0 "Serbian Rearmament"
 MSGA_public_health:0 "Public Health Response"
 MSGA_SER_the_streets:0 "The Streets"
 MSGA_SER_the_presidency:0 "The Presidency"
 MSGA_SER_contested:0 "Fragile Balance"
 MSGA_SER_streets_dominant:0 "Public Anger"
 MSGA_SER_streets_crisis:0 "The Streets Erupt"
 MSGA_SER_presidency_dominant:0 "Consolidated Authority"
 MSGA_SER_presidential_control:0 "Presidential Control"
 MSGA_SER_streets_presidency:0 "The Streets and the Presidency"
 MSGA_SER_reaffirm_presidential_authority:0 "Reaffirm Presidential Authority"
 MSGA_SER_reaffirm_presidential_authority_desc:0 "Spend 35 PP to move the balance +0.04 toward the Presidency. 120-day cooldown; at most three uses during Phase 1."
 MSGA_SER_address_public_grievances:0 "Address Public Grievances"
 MSGA_SER_address_public_grievances_desc:0 "Spend 40 PP and £GFX_dx 0.05 billion × (1 + inflation) on concessions. Stability +1%, balance −0.02 toward the Streets. 120-day cooldown; at most two uses."
 MSGA_public_order:0 "Emergency Public Order Measures"
 MSGA_public_order_desc:0 "Spend 25 PP for Presidency +0.06 and Stability −1% immediately. Backlash follows after 30 days: Stability −2%, Streets +0.04, halved if the presidency previously chose national dialogue. 180-day cooldown; at most two uses."
 MSGA_assess_world:0 "Assess the New European Balance"
 MSGA_assess_world_desc:0 "Receive Serbia's one-time reaction if TFR's American fracture has occurred and the weekly observer has not yet delivered the briefing."
 MSGA_pandemic_disruption:0 "Pandemic Disruption"
 MSGA_pandemic_disruption_desc:0 "The first shock strains hospitals, production and business activity. Two completed health measures soften the disruption; a managed reopening can end it."
 MSGA_pandemic_easing:0 "Pandemic Disruption — Easing"
 MSGA_pandemic_easing_desc:0 "Targeted measures have reduced the disruption. An underprepared reopening retains these small penalties for 60 days."
 MSGA_capital_commitment:0 "Public Investment Commitment"
 MSGA_capital_commitment_desc:0 "Administrative and construction capacity are tied to one major funded programme. Other major MSGA projects must wait until it finishes."
 MSGA_recovery_programme:0 "Serbian Recovery Programme"
 MSGA_recovery_programme_desc:0 "The programme starts at +5% Business Value. Completed projects increase it in steps; the economic capstone adds +3 percentage points. Total bonus is capped at +10%. Each upgrade renews a 365-day window."
 MSGA_defence_reorientation:0 "Defence Reorientation"
 MSGA_defence_reorientation_desc:0 "The programme develops in stages: factory output +5%, planning +5% and organisation recovery +5%, efficiency growth +5%, supply consumption −5%, then total planning +10%. Each military milestone renews its 365-day window."
 MSGA_doctrine_bonus:0 "Serbian Doctrine Review"
 MSGA_unlock_health_tt:0 "Unlocks four short, one-time §YPublic Health Response§! decisions. Two completed measures soften disruption and allow a successful managed reopening."
 MSGA_reopening_tt:0 "Managed reopening after two completed health measures ends disruption. An underprepared managed reopening retains easing penalties for 60 days. Accelerated reopening incurs a separate 30-day confidence strain, alongside immediate political costs."
 MSGA_managed_reopening_tt:0 "With two completed health measures: remove disruption, Stability +2%, Presidency +0.04. Otherwise: easing disruption for 60 days and Streets +0.02."
 MSGA_unlock_capital_tt:0 "Begins §YSerbian Recovery Programme§!: Business Value +5% for 365 days. Later economic milestones and completed projects upgrade the programme, capped at +10%; each upgrade renews its duration."
 MSGA_unlock_belgrade_tt:0 "Adds one shared building slot in Serbian-controlled Belgrade. Unlocks a funded Office Park and +1 percentage point Business Value. If Belgrade is unavailable, the national recovery programme gains +1 point instead."
 MSGA_unlock_morava_tt:0 "Adds one infrastructure level in Serbian-controlled Šumadija and Western Serbia. Unlocks funded corridor works: another infrastructure level and +1 percentage point Business Value. If immediate construction is impossible, recovery gains +1 point instead."
 MSGA_unlock_resources_tt:0 "Unlocks funded Bor, Kolubara and Jadar programmes. Coal is an existing resource; copper and prospective lithium are represented through investment and Business Value."
 MSGA_recovery_capstone_tt:0 "Ends remaining MSGA pandemic and reopening penalties. Adds +3 percentage points Business Value to the renewed Recovery Programme, capped at +10%. Unlocks Serbian enterprise support, available after the presidential mandate."
 MSGA_unlock_government_tt:0 "Unlocks §YReaffirm Presidential Authority§! in Serbian Domestic Affairs."
 MSGA_backlash_tt:0 "§RIn 30 days:§! Stability −2% and the balance moves −0.04 toward the Streets."
 MSGA_mandate_tt:0 "Unlocks limited emergency public-order measures and enables domestic enterprise support."
 MSGA_unlock_defence_tt:0 "Unlocks §YExpand Defence Production§!: a second military factory after 75 PP, £GFX_dx 0.35 billion × (1 + inflation), and 120 days. It shares the civilian investment slot."
 MSGA_army_tt:0 "Defence Reorientation gains §G+5% planning speed§! and §G+5% army organisation recovery§!. Renews the programme for 365 days. These are targeted military improvements, rather than a bonus to all research."
 MSGA_unlock_procurement_tt:0 "Adds +5% production efficiency growth to the 365-day defence programme. Unlocks a paid one-time equipment package."
 MSGA_supply_tt:0 "Eastern Serbia receives one infrastructure level if capacity remains; otherwise gain 5 Army XP. Adds −5% supply consumption to the defence programme."
 MSGA_readiness_tt:0 "Defence Reorientation reaches §G+10% total planning speed§!, retaining +5% factory output, +5% production efficiency growth, −5% supply consumption and +5% organisation recovery. Renews the programme for 365 days."
 MSGA_shield_tt:0 "Unlocks §YSerbian Strategic Review§!: assess NATO readiness and strengthen border intelligence. Strategic Vigilance grants +5% planning speed and +5% army intelligence for 180 days. Opens the final Kosovo briefing; no operation is ordered."
 MSGA_shield_unlock_tt:0 "The American fracture has been recorded permanently for Serbia. §YWatch the Western Shield§! can now be taken after its domestic, economic and readiness prerequisites."
 MSGA_phase2_tt:0 "Unlocks §YThe Kosovo Crisis§! with five paid, one-time preparatory reviews. Dossier, KFOR, staff, regional contacts and northern contingency findings are retained for later crisis policy. No war, occupation or territorial transfer is authorised."
 MSGA_refund_tt:0 "The programme cannot deliver under current ownership or capacity conditions. Its PP cost and exact treasury amount paid are returned through TFR’s treasury API."
 MSGA_jadar_survey_tt:0 "Unlocks the Jadar feasibility programme. No operating lithium mine or strategic-resource deposit is created."
 MSGA_jadar_feasibility_tt:0 "Engineering and permitting dossier prepared for future mineral policy. Business Value +1 point within the recovery programme; no operating mine is created."
 MSGA_china_tt:0 "Receives an inflation-adjusted £GFX_dx 0.20 billion loan and the same debt principal through TFR's own API. The loan can fund civilian or military projects."
 MSGA_russia_tt:0 "Reduces the one-time strategic procurement treasury cost by 25%. Cooperation does not create an alliance."
 MSGA_domestic_context_tt:0 "Activates §YThe Streets and the Presidency§! and reveals §YSerbian Domestic Affairs§!. The opening briefing establishes the presidency’s domestic programme."
 MSGA_morava_fallback_tt:0 "The corridor cannot receive another infrastructure level under current ownership or capacity conditions. The Recovery Programme gains +1 percentage point Business Value instead."
 MSGA_reopening_strain:0 "Reopening Without Consensus"
 MSGA_reopening_strain_desc:0 "Restrictions were lifted faster than public confidence could recover. For 30 days, fragile trust weighs on stability and business activity."
 MSGA_coordinated_government:0 "Coordinated Government"
 MSGA_coordinated_government_desc:0 "The presidency has brought ministries behind a common domestic programme. Political power gain +5%. The mandate focus develops this into a settled presidential administration."
 MSGA_presidential_administration:0 "Presidential Administration"
 MSGA_presidential_administration_desc:0 "Coordinated ministries and a defined mandate give the presidency greater administrative continuity. Political power gain +5%; stability +3%. Public order still carries a political cost."
 MSGA_strategic_vigilance:0 "Strategic Vigilance"
 MSGA_strategic_vigilance_desc:0 "Staff planning and border reporting have been directed toward a changing regional security environment. Planning speed +5%; army intelligence +5%, for 180 days. This assessment is preparatory."
 MSGA_order_backlash_tt:0 "§RBacklash in 30 days:§! Stability −2% and Streets +0.04. A previous national dialogue halves these delayed penalties to Stability −1% and Streets +0.02."
 MSGA.12.t:0 "Reassessing the Western Shield"
 MSGA.12.d:0 "The cabinet and general staff have brought their assessments together. Serbia’s domestic recovery offers room for a more deliberate policy, while Washington’s fracture has changed the assumptions behind Balkan security. KFOR and the remaining European commitments must be assessed on their own terms. The presidency orders intelligence and contingency reviews before any further decision."
 MSGA.12.a:0 "Commission the strategic review."
 MSGA_strategic_review:0 "Serbian Strategic Review"
 MSGA_strategic_review_desc:0 "Completed strategic reviews: [?MSGA_strategic_review_progress|0]/2. Staff assessments improve readiness and preserve findings for the next crisis discussion."
 MSGA_kosovo_crisis:0 "The Kosovo Crisis"
 MSGA_kosovo_crisis_desc:0 "Completed preparatory reviews: [?MSGA_kosovo_review_progress|0]/5. These findings prepare later crisis policy. No decision here starts a war, issues an ultimatum or transfers territory."
 MSGA_assess_nato_readiness:0 "Assess NATO Readiness"
 MSGA_assess_nato_readiness_desc:0 "Spend 25 PP and 14 days on a general staff assessment of NATO commitments after the American fracture. Gains 5 Army XP and records an alliance-readiness assessment for later crisis policy. One time."
 MSGA_strengthen_border_intelligence:0 "Strengthen Border Intelligence"
 MSGA_strengthen_border_intelligence_desc:0 "Spend 35 PP and £GFX_dx 0.03 billion × (1 + inflation) on a 30-day reporting review. Renews Strategic Vigilance for 180 days and records a border-intelligence finding. One time."
 MSGA_nato_assessment_tt:0 "Records the completed NATO readiness assessment for later crisis policy."
 MSGA_border_review_tt:0 "Records the border-intelligence review and renews Strategic Vigilance for 180 days."
 MSGA_commission_kosovo_dossier:0 "Commission the Kosovo Crisis Dossier"
 MSGA_commission_kosovo_dossier_desc:0 "Spend 30 PP and 21 days to consolidate legal, diplomatic and economic findings. Records a completed crisis dossier and advances the review counter. One time."
 MSGA_assess_kfor:0 "Assess KFOR Presence"
 MSGA_assess_kfor_desc:0 "Spend 25 PP and 14 days assessing international deployments and their political constraints. Records the KFOR assessment and advances the review counter. One time."
 MSGA_consult_general_staff:0 "Consult the Serbian General Staff"
 MSGA_consult_general_staff_desc:0 "Spend 25 PP and 14 days reviewing readiness and escalation risks. Gains 5 Army XP, records staff advice and advances the crisis review counter. One time."
 MSGA_contact_regional_partners:0 "Contact Regional Partners"
 MSGA_contact_regional_partners_desc:0 "Commit 25 PP to 21 days of consultations; recover 10 PP on delivery. Records regional consultations and advances the crisis review counter. No alliance or faction membership is created. One time."
 MSGA_map_northern_contingencies:0 "Map Northern Kosovo Contingencies"
 MSGA_map_northern_contingencies_desc:0 "Spend 30 PP and 21 days on staff mapping and civilian contingency planning. Gains 3 Army XP, records the northern assessment and advances the crisis review counter. No military deployment or occupation occurs. One time."
 MSGA_dossier_ready_tt:0 "The Kosovo crisis dossier is complete and retained for later policy."
 MSGA_kfor_review_tt:0 "The assessment of KFOR presence is complete and retained for later policy."
 MSGA_regional_review_tt:0 "Regional diplomatic consultations are complete and retained for later policy."
 MSGA_contingency_review_tt:0 "Northern contingency mapping is complete and retained for later policy."
