l_english:
 MSGA_SER_phase1:0 "Serbia: The Presidency and the Streets"
 MSGA_serbia_in_the_new_decade:0 "A New Decade"
 MSGA_serbia_in_the_new_decade_desc:0 "Belgrade enters 2020 with a familiar president and an unfamiliar horizon. Serbia's room to manoeuvre will depend on a functioning state, a productive economy and the public's willingness to endure another crisis."
 MSGA_contain_the_outbreak:0 "Contain the Outbreak"
 MSGA_contain_the_outbreak_desc:0 "Prepare border checks, emergency screening and public health controls before the outbreak spreads. Decisions can buy time while the rest of the national programme continues."
 MSGA_reopen_on_serbian_terms:0 "Reopen on Serbian Terms"
 MSGA_reopen_on_serbian_terms_desc:0 "Keep shops and factories operating under public health precautions while the government prepares its investment programme. Vaccination remains a separate decision once supplies become available."
 MSGA_attract_productive_capital:0 "Attract Productive Capital"
 MSGA_attract_productive_capital_desc:0 "Contracts matter only when they become jobs, skills and taxable activity. Belgrade will offer a recovery framework for productive capital while retaining control over where scarce public funds go."
 MSGA_upgrade_belgrade_services:0 "Modernise Belgrade Services"
 MSGA_upgrade_belgrade_services_desc:0 "Belgrade's service firms need modern premises, reliable administration and investment beyond the ceremonial ribbon. A funded business district programme will build an Office Park rather than promise one."
 MSGA_develop_the_morava_corridor:0 "Develop the Morava Corridor"
 MSGA_develop_the_morava_corridor_desc:0 "The corridor between Čačak and Kruševac connects industrial towns that cannot prosper on speeches alone. A staged programme will improve the movement of goods through Šumadija and Western Serbia."
 MSGA_independent_resource_policy:0 "An Independent Resource Policy"
 MSGA_independent_resource_policy_desc:0 "Bor's copper, Jadar's prospective lithium and the lignite basins present different choices. Serbia needs investment and credible permits, not a map painted with imaginary deposits."
 MSGA_serbian_recovery:0 "A Recovery Made in Serbia"
 MSGA_serbian_recovery_desc:0 "The recovery will be judged in workshops, offices and household budgets. Domestic firms must be able to compete alongside foreign investors, and every completed programme must deliver more than political theatre."
 MSGA_consolidate_the_state:0 "Consolidate the State"
 MSGA_consolidate_the_state_desc:0 "The presidency depends on ministries capable of carrying out policy. Coordinating the machinery of government is a quieter exercise of power than another campaign rally, but no less consequential."
 MSGA_manage_the_streets:0 "Manage the Streets"
 MSGA_manage_the_streets_desc:0 "Protests cannot be reduced to a statistic. A firm response may restore immediate control, while concessions can preserve trust at a political and financial cost. The presidency must choose what kind of authority it intends to exercise."
 MSGA_presidential_mandate:0 "A Presidential Mandate"
 MSGA_presidential_mandate_desc:0 "Vučić remains at the centre of Serbian politics. A renewed mandate must rest on an administration that can deliver, a public that sees some results and a presidency prepared to bear responsibility for its decisions."
 MSGA_restore_defence_production:0 "Restore Defence Production"
 MSGA_restore_defence_production_desc:0 "The country's defence workshops retain skills that cannot be recreated overnight. Recommissioning capacity in Šumadija will restore one military factory; a second expansion will require a funded commitment."
 MSGA_modernise_the_army:0 "Modernise the Army"
 MSGA_modernise_the_army_desc:0 "Better training and organisation will bring existing formations closer to their potential. A modernisation programme must outlast a single exercise."
 MSGA_arms_for_an_uncertain_world:0 "Arms for an Uncertain World"
 MSGA_arms_for_an_uncertain_world_desc:0 "Production must build usable reserves before a crisis disrupts suppliers. Improving production routines and paying for a limited procurement package will strengthen the stockpile without multiplying factories for free."
 MSGA_secure_supply_lines:0 "Secure the Supply Lines"
 MSGA_secure_supply_lines_desc:0 "Readiness ends where fuel, spare parts and ammunition stop arriving. Improving Eastern Serbia's infrastructure and tightening supply routines prepares the army for uncertainty across the region."
 MSGA_ready_for_the_uncertain:0 "Ready for the Uncertain"
 MSGA_ready_for_the_uncertain_desc:0 "Serbia must sustain an organised army and a credible mobilisation system before considering its regional options."
 MSGA_watch_the_western_shield:0 "Watch the Western Shield"
 MSGA_watch_the_western_shield_desc:0 "Belgrade must monitor the Western security order and prepare for a possible American fracture. A distracted Washington does not make every regional gamble safe."
 MSGA_the_kosovo_question:0 "The Kosovo Question"
 MSGA_the_kosovo_question_desc:0 "Kosovo remains the unresolved question at the centre of Serbian strategy. With the state steadier, the army better prepared and the international order fractured, the presidency can commission a crisis review. A decision to fight belongs to the next phase."
 MSGA.1.t:0 "A New Decade in Serbia"
 MSGA.1.d:0 "A new decade begins with familiar questions in Belgrade. Emigration drains skilled workers from provincial towns, investment remains uneven, and Kosovo continues to shape political debate. The presidency promises continuity, but citizens want to know what that continuity will deliver.\n\nThe cabinet must begin with practical tasks: strengthen the state, restore economic confidence and prepare for a world whose old certainties may be fading."
 MSGA.1.a:0 "Begin with what Serbia can control."
 MSGA.2.t:0 "Preparing for the Outbreak"
 MSGA.2.d:0 "Reports across Europe demand a response before Serbian hospitals are overwhelmed. Border precautions, emergency screening and stronger public health controls can delay the outbreak. The cabinet can continue its national programme while preparing vaccination for 2021."
 MSGA.2.a:0 "Mobilise the health system."
 MSGA.3.t:0 "Serbia Reopens"
 MSGA.3.d:0 "Shops and factories are returning to regular schedules under public health precautions. Economic activity must continue while medical preparations proceed. The next chapter depends on productive investment, stronger domestic institutions and renewed industrial capacity."
 MSGA.3.a:0 "Return to work with confidence."
 MSGA.3.b:0 "Lift restrictions immediately."
 MSGA.4.t:0 "Belgrade in the Streets"
 MSGA.4.d:0 "Demonstrations have filled the streets of Belgrade. Opposition groups demand concessions and accountability, while government supporters insist that the state must preserve order. Police commanders and ministers await a clear instruction from the presidency.\n\nA restrained response costs political capital but may restore confidence. A firm response can consolidate authority quickly, at the price of lingering distrust. Both courses leave the cabinet responsible for governing after the crowds disperse."
 MSGA.4.a:0 "Restore order."
 MSGA.4.b:0 "Keep the response measured."
 MSGA.5.t:0 "Capital Returns to Serbia"
 MSGA.5.d:0 "Domestic businesses and foreign investors are once again considering Serbia as a manufacturing and service hub. Suppliers see opportunities in new production lines, while service firms look for skilled workers and modern premises.\n\nThe productive-capital programme aims to turn this interest into a wider business base and sustained income growth. The government's task is to keep investment productive, rather than allow enthusiasm to become another round of empty promises."
 MSGA.5.a:0 "Serbia is open for business."
 MSGA.6.t:0 "Three Partners, One Priority"
 MSGA.6.d:0 "European investors offer access to service markets. Chinese financing offers liquidity for physical works. Russian cooperation offers an easier route to military preparation. Belgrade can continue talking to everyone, but this recovery programme can give priority to only one partner."
 MSGA.6.a:0 "Prioritise European commercial investment."
 MSGA.6.b:0 "Accept Chinese infrastructure financing."
 MSGA.6.c:0 "Expand Russian defence cooperation."
 MSGA.7.t:0 "Serbia's Arms Industry Expands"
 MSGA.7.d:0 "New production capacity is entering service in Šumadija and Western Serbia. The industrial towns around Čačak and Kruševac provide a practical base for rebuilding specialist defence production outside the capital.\n\nThe temporary production drive will help factories increase output and complete further military construction. Managers must now turn the new facilities into reliable deliveries."
 MSGA.7.a:0 "Keep the programme measured."
 MSGA.8.t:0 "The Western Shield Cracks"
 MSGA.8.d:0 "The United States has descended into a crisis that has fractured the authority of Washington. European governments are scrambling to understand what American disorder means for NATO commitments, regional security and their own defence plans.\n\nSerbia's monitoring programme has tracked the change closely. The old framework is weakening, but the General Staff cautions that uncertainty can endanger Serbia as easily as it can create opportunities. Belgrade must decide what to prepare before deciding what to demand."
 MSGA.8.a:0 "The balance is changing."
 MSGA.9.t:0 "The Question We Never Abandoned"
 MSGA.9.d:0 "Kosovo has remained at the centre of Serbian politics, frozen for years beneath a Western-backed security order. Every government has inherited the question, even when circumstances left little room to act.\n\nThat order is now less certain. With recovery, political consolidation and army reform behind it, the presidency has commissioned a crisis review. Belgrade must consider what Serbia is prepared to do, what it can sustain and how escalation might unfold. The first step is to prepare the state."
 MSGA.9.a:0 "Prepare the state."
 MSGA.10.t:0 "The Programme Delivers"
 MSGA.10.d:0 "Officials have presented the completion report for the funded programme. Its promised asset or economic benefit is now in place. The public commitment has ended, freeing capacity for the next civilian or military investment."
 MSGA.10.a:0 "Publish the accounts and move on."
 MSGA.11.t:0 "The Cost of a Firm Response"
 MSGA.11.d:0 "The immediate confrontation passed, but images of the response have remained in circulation. Opposition organisers have found a common grievance. An earlier national dialogue, if pursued, gives ministers a channel to contain the renewed unrest. Authority won quickly must still be sustained."
 MSGA.11.a:0 "Absorb the political cost."
 MSGA_belgrade_business:0 "Belgrade Business Development"
 MSGA_belgrade_business_desc:0 "Create one Office Park in Belgrade (state 107) and add +1 percentage point to the recovery programme's Business Value bonus. Shared investment slot; construction speed −5% during works.\n\nBudget: £GFX_dx 0.25 billion × (1 + TFR inflation), charged at activation, plus 50 PP. Duration: 90 days. Requires the displayed treasury balance to cover the current quote. Ownership or capacity failure refunds PP and the exact treasury amount paid."
 MSGA_morava_works:0 "Complete the Morava Corridor Works"
 MSGA_morava_works_desc:0 "Complete another infrastructure level in Šumadija and Western Serbia (state 1296) and add +1 percentage point Business Value to the renewed Recovery Programme. Costs 50 PP and £GFX_dx 0.20 billion × (1 + inflation); 120 days. Uses the shared major project slot and temporary construction commitment. Ownership or capacity failure refunds PP and the exact treasury amount paid."
 MSGA_expand_defence:0 "Expand Defence Production"
 MSGA_expand_defence_desc:0 "Build an additional military factory in Central Serbia through a one-time funded expansion. Costs 75 PP and £GFX_dx 0.35 billion × (1 + TFR inflation); 120 days. Uses the shared project slot. Ownership or capacity failure refunds PP and the exact treasury payment."
 MSGA_bor_modernisation:0 "Modernise the Bor Mining Complex"
 MSGA_bor_modernisation_desc:0 "Fund processing and access improvements around Bor and Majdanpek. Adds +1 percentage point Business Value and one infrastructure level in Eastern Serbia if capacity remains (otherwise +15 PP). Copper is represented economically; no fictitious steel or tungsten deposit.\n\nBudget: £GFX_dx 0.15 billion × (1 + TFR inflation), charged at activation, plus 45 PP. Duration: 120 days. Requires the displayed treasury balance to cover the current quote. Ownership or capacity failure refunds PP and the exact treasury amount paid."
 MSGA_lignite_modernisation:0 "Modernise the Kolubara Lignite Basin"
 MSGA_lignite_modernisation_desc:0 "Improve existing lignite extraction in western Serbia. Completion adds 4 coal in state 1296 using the existing resource abstraction.\n\nBudget: £GFX_dx 0.10 billion × (1 + TFR inflation), charged at activation, plus 40 PP. Duration: 90 days. Requires the displayed treasury balance to cover the current quote. Ownership or capacity failure refunds PP and the exact treasury amount paid."
 MSGA_jadar_survey:0 "Survey the Jadar Basin"
 MSGA_jadar_survey_desc:0 "Commission geological and environmental work in western Serbia. Unlocks a feasibility programme; this does not open a lithium mine.\n\nBudget: £GFX_dx 0.05 billion × (1 + TFR inflation), charged at activation, plus 35 PP. Duration: 180 days. Requires the displayed treasury balance to cover the current quote. Ownership or capacity failure refunds PP and the exact treasury amount paid."
 MSGA_jadar_feasibility:0 "Commission the Jadar Feasibility Programme"
 MSGA_jadar_feasibility_desc:0 "After the survey, fund engineering, environmental assessment and local services. Adds +1 percentage point Business Value; establishes a dossier for future mineral policy. No resource deposit is granted.\n\nBudget: £GFX_dx 0.20 billion × (1 + TFR inflation), charged at activation, plus 40 PP. Duration: 180 days. Requires the displayed treasury balance to cover the current quote. Ownership or capacity failure refunds PP and the exact treasury amount paid."
 MSGA_support_enterprise:0 "Support Serbian Enterprise"
 MSGA_support_enterprise_desc:0 "Fund domestic suppliers and service firms. Costs 40 PP and £GFX_dx 0.10 billion × (1 + inflation). Adds +1 percentage point to the recovery programme's Business Value bonus for its renewed 365-day duration. One time; requires the recovery focus and presidential mandate."
 MSGA_foreign_priority:0 "Choose a Foreign Cooperation Priority"
 MSGA_foreign_priority_desc:0 "Costs 25 PP and £GFX_dx 0.10 billion × (1 + inflation) to arrange a recovery partnership. Choose Europe (+2 points Business Value), China (a £GFX_dx 0.20 billion inflation-adjusted loan with matching debt), or Russia (+10 Army XP). One priority for Phase 1."
 MSGA_procure_equipment:0 "Secure Strategic Stocks"
 MSGA_procure_equipment_desc:0 "Spend $3.0 billion from the treasury on a one-time 30-day reserve package: 3,500 infantry weapons, 100 Command Equipment, 50 early towed artillery and 150 Motorized Equipment, plus 3 Army XP. No political power is required."
 MSGA_targeted_testing:0 "Targeted Testing"
 MSGA_targeted_testing_desc:0 "Buy test kits and organise targeted screening. Costs 25 PP and £GFX_dx 0.01 billion × (1 + inflation). Completes in 14 days; one response measure and Presidency +0.02. Two completed measures soften Pandemic Disruption and allow a successful managed reopening."
 MSGA_essential_workers:0 "Protect Essential Workers"
 MSGA_essential_workers_desc:0 "Protect key workers with equipment and wage support. Costs 35 PP and £GFX_dx 0.03 billion × (1 + inflation). Completes in 21 days; one response measure and Presidency +0.02. Two completed measures soften Pandemic Disruption and allow a successful managed reopening."
 MSGA_hospital_funding:0 "Emergency Support for Serbian Hospitals"
 MSGA_hospital_funding_desc:0 "Commit 50 political power to a 35-day hospital support programme. Completion provides +1% stability and 100 days of Emergency Hospital Capacity, mitigating production and construction disruption."
 MSGA_medical_assistance:0 "Request Foreign Medical Assistance"
 MSGA_medical_assistance_desc:0 "Request practical medical deliveries while preserving Serbia's wider diplomatic choices. Costs 25 PP. Completes in 14 days; one response measure and Presidency +0.02. Two completed measures soften Pandemic Disruption and allow a successful managed reopening."
 MSGA_SER_streets_presidency_category:0 "Serbian Domestic Affairs"
 MSGA_economic_development:0 "Serbian Economic Development"
 MSGA_rearmament:0 "Serbian Rearmament"
 MSGA_public_health:0 "Public Health Response"
 MSGA_SER_the_streets:0 "The Streets"
 MSGA_SER_the_presidency:0 "The Presidency"
 MSGA_SER_contested:0 "Fragile Balance"
 MSGA_SER_streets_dominant:0 "Public Anger"
 MSGA_SER_streets_crisis:0 "The Streets Erupt"
 MSGA_SER_presidency_dominant:0 "Consolidated Authority"
 MSGA_SER_presidential_control:0 "Presidential Control"
 MSGA_SER_streets_presidency:0 "The Streets and the Presidency"
 MSGA_SER_reaffirm_presidential_authority:0 "Reaffirm Presidential Authority"
 MSGA_SER_reaffirm_presidential_authority_desc:0 "Spend 35 PP to move the balance +0.04 toward the Presidency. 120-day cooldown; at most three uses during Phase 1."
 MSGA_SER_address_public_grievances:0 "Address Public Grievances"
 MSGA_SER_address_public_grievances_desc:0 "Spend 40 PP and £GFX_dx 0.05 billion × (1 + inflation) on concessions. Stability +1%, balance −0.02 toward the Streets. 120-day cooldown; at most two uses."
 MSGA_public_order:0 "Emergency Public Order Measures"
 MSGA_public_order_desc:0 "Spend 25 PP for Presidency +0.06 and Stability −1% immediately. Backlash follows after 30 days: Stability −2%, Streets +0.04, halved if the presidency previously chose national dialogue. 180-day cooldown; at most two uses."
 MSGA_assess_world:0 "Assess the New European Balance"
 MSGA_assess_world_desc:0 "After Watch the Western Shield, request the one-time collapse report immediately if TFR's American-fracture signal is present and the delayed observer has not yet delivered it."
 MSGA_pandemic_disruption:0 "Pandemic Disruption"
 MSGA_pandemic_disruption_desc:0 "The first shock strains hospitals, production and business activity. Two completed health measures soften the disruption; a managed reopening can end it."
 MSGA_pandemic_easing:0 "Pandemic Disruption — Easing"
 MSGA_pandemic_easing_desc:0 "Targeted measures have reduced the disruption. An underprepared reopening retains these small penalties for 60 days."
 MSGA_capital_commitment:0 "Public Investment Commitment"
 MSGA_capital_commitment_desc:0 "Administrative and construction capacity are tied to one major funded programme. Other major MSGA projects must wait until it finishes."
 MSGA_recovery_programme:0 "Serbian Recovery Programme"
 MSGA_recovery_programme_desc:0 "Funded projects provide an additional, temporary Business Value programme. Project and partner improvements renew its 365-day window, capped at +10%. Productive Capital remains a separate permanent spirit."
 MSGA_defence_reorientation:0 "Defence Reorientation"
 MSGA_defence_reorientation_desc:0 "The programme develops in stages: factory output +5%, planning +5% and organisation recovery +5%, efficiency growth +5%, supply consumption −5%, then total planning +10%. Each military milestone renews its 365-day window."
 MSGA_doctrine_bonus:0 "Serbian Doctrine Review"
 MSGA_unlock_health_tt:0 "Unlocks three one-time outbreak delays: 10 PP for 120 days, 15 PP for 130 days and 20 PP for 150 days. Mass Vaccination costs 75 PP, takes 20 days and becomes available on 1 January 2021."
 MSGA_reopening_tt:0 "Reopening activates the Serbian Chronicle: occasional eligible stories every 120–210 days, with quiet periods between reports. The COVID decisions continue independently."
 MSGA_managed_reopening_tt:0 "With two completed health measures: remove disruption, Stability +2%, Presidency +0.04. Otherwise: easing disruption for 60 days and Streets +0.02."
 MSGA_unlock_capital_tt:0 "Productive Capital is permanent: −2% consumer goods factor, +2% factory output, +5% Business Value and +2% income growth. Further investment programmes open after A Recovery Made in Serbia."
 MSGA_unlock_belgrade_tt:0 "Belgrade receives five shared building slots, two civilian factories and one Office Park. Further investment programmes open after A Recovery Made in Serbia."
 MSGA_unlock_morava_tt:0 "Adds up to two infrastructure levels in Šumadija and Western Serbia, subject to the building cap. Further funded corridor improvements open after A Recovery Made in Serbia."
 MSGA_unlock_resources_tt:0 "Adds 10 steel, 5 tungsten and 6 chromium in Belgrade as the resource-policy reward. Further mining and energy projects open after A Recovery Made in Serbia."
 MSGA_recovery_capstone_tt:0 "Remove §YScars Of The Bombings§! and its −10% War Support and −15% Factory Output penalties."
 MSGA_unlock_government_tt:0 "Unlocks §YReaffirm Presidential Authority§! in Serbian Domestic Affairs."
 MSGA_backlash_tt:0 "§RIn 30 days:§! Stability −2% and the balance moves −0.04 toward the Streets."
 MSGA_mandate_tt:0 "Replaces A Consolidated State with Presidential Mandate: +10% political power gain and +5% stability."
 MSGA_unlock_defence_tt:0 "Restores two military factories in Šumadija and Western Serbia. Defence Production Drive lasts 365 days: +5% factory output and +5% military factory construction speed."
 MSGA_army_tt:0 "Begins a permanent army modernisation programme and grants one 50% land doctrine cost reduction."
 MSGA_unlock_procurement_tt:0 "Delivers 3,000 modern infantry equipment, 400 support equipment and 250 motor vehicles. Further funded procurement remains available."
 MSGA_supply_tt:0 "Builds a fuel silo and up to one infrastructure level in central Serbia; delivers 15,000 fuel. Strategic Reserves lasts 180 days: +5% fuel gain and −5% supply consumption."
 MSGA_readiness_tt:0 "Upgrades the army programme to +5% organisation, −5% training time and +10% mobilisation speed."
 MSGA_shield_tt:0 "Activates monitoring of the Western security order. The Western Shield report will arrive after an American collapse, enabling The Kosovo Question."
 MSGA_shield_unlock_tt:0 "The Kosovo Question can now be pursued once the monitoring focus is complete."
 MSGA_phase2_tt:0 "Loads the Kosovo campaign chapter. Existing preparation studies and early decision unlocks remain available."
 MSGA_refund_tt:0 "The programme cannot deliver under current ownership or capacity conditions. Its PP cost and exact treasury amount paid are returned through TFR’s treasury API."
 MSGA_jadar_survey_tt:0 "Unlocks the Jadar feasibility programme. No operating lithium mine or strategic-resource deposit is created."
 MSGA_jadar_feasibility_tt:0 "Engineering and permitting dossier prepared for future mineral policy. Business Value +1 point within the recovery programme; no operating mine is created."
 MSGA_china_tt:0 "Receives an inflation-adjusted £GFX_dx 0.20 billion loan and the same debt principal through TFR's own API. The loan can fund civilian or military projects."
 MSGA_russia_tt:0 "Russian cooperation supports military preparation. The strategic reserve package costs $3.0B regardless of partner; cooperation does not create an alliance."
 MSGA_domestic_context_tt:0 "Activates §YThe Streets and the Presidency§! and reveals §YSerbian Domestic Affairs§!. The opening briefing establishes the presidency’s domestic programme."
 MSGA_morava_fallback_tt:0 "The corridor is unavailable: a small treasury payment substitutes for the state development reward."
 MSGA_reopening_strain:0 "Reopening Without Consensus"
 MSGA_reopening_strain_desc:0 "Restrictions were lifted faster than public confidence could recover. For 30 days, fragile trust weighs on stability and business activity."
 MSGA_coordinated_government:0 "A Consolidated State"
 MSGA_coordinated_government_desc:0 "The presidency has brought ministries behind a common domestic programme. Political power gain +5%; stability +3%."
 MSGA_presidential_administration:0 "Presidential Mandate"
 MSGA_presidential_administration_desc:0 "A defined mandate gives the presidency greater administrative continuity. Political power gain +10%; stability +5%."
 MSGA_strategic_vigilance:0 "Strategic Vigilance"
 MSGA_strategic_vigilance_desc:0 "Staff planning and border reporting have been directed toward a changing regional security environment. Planning speed +5%; army intelligence +5%, for 180 days. This assessment is preparatory."
 MSGA_order_backlash_tt:0 "§RBacklash in 30 days:§! Stability −2% and Streets +0.04. A previous national dialogue halves these delayed penalties to Stability −1% and Streets +0.02."
 MSGA.12.t:0 "Reassessing the Western Shield"
 MSGA.12.d:0 "The cabinet and general staff have brought their assessments together. Serbia’s domestic recovery offers room for a more deliberate policy, while Washington’s fracture has changed the assumptions behind Balkan security. KFOR and the remaining European commitments must be assessed on their own terms. The presidency orders intelligence and contingency reviews before any further decision."
 MSGA.12.a:0 "Commission the strategic review."
 MSGA_strategic_review:0 "Serbian Strategic Review"
 MSGA_strategic_review_desc:0 "Completed strategic reviews: [?MSGA_strategic_review_progress|0]/2. Staff assessments improve readiness and preserve findings for the next crisis discussion."
 MSGA_kosovo_crisis:0 "The Kosovo Crisis"
 MSGA_kosovo_crisis_desc:0 "Completed preparatory reviews: [?MSGA_kosovo_review_progress|0]/5. These findings prepare later crisis policy. No decision here starts a war, issues an ultimatum or transfers territory."
 MSGA_assess_nato_readiness:0 "Assess NATO Readiness"
 MSGA_assess_nato_readiness_desc:0 "Spend 25 PP and 14 days on a general staff assessment of NATO commitments after the American fracture. Gains 5 Army XP and records an alliance-readiness assessment for later crisis policy. One time."
 MSGA_strengthen_border_intelligence:0 "Strengthen Border Intelligence"
 MSGA_strengthen_border_intelligence_desc:0 "Spend 35 PP and £GFX_dx 0.03 billion × (1 + inflation) on a 30-day reporting review. Renews Strategic Vigilance for 180 days and records a border-intelligence finding. One time."
 MSGA_nato_assessment_tt:0 "Records the completed NATO readiness assessment for later crisis policy."
 MSGA_border_review_tt:0 "Records the border-intelligence review and renews Strategic Vigilance for 180 days."
 MSGA_commission_kosovo_dossier:0 "Commission the Kosovo Crisis Dossier"
 MSGA_commission_kosovo_dossier_desc:0 "Spend 30 PP and 21 days to consolidate legal, diplomatic and economic findings. Records a completed crisis dossier and advances the review counter. One time."
 MSGA_assess_kfor:0 "Assess KFOR Presence"
 MSGA_assess_kfor_desc:0 "Spend 25 PP and 14 days assessing international deployments and their political constraints. Records the KFOR assessment and advances the review counter. One time."
 MSGA_consult_general_staff:0 "Consult the Serbian General Staff"
 MSGA_consult_general_staff_desc:0 "Spend 25 PP and 14 days reviewing readiness and escalation risks. Gains 5 Army XP, records staff advice and advances the crisis review counter. One time."
 MSGA_contact_regional_partners:0 "Contact Regional Partners"
 MSGA_contact_regional_partners_desc:0 "Commit 25 PP to 21 days of consultations; recover 10 PP on delivery. Records regional consultations and advances the crisis review counter. No alliance or faction membership is created. One time."
 MSGA_map_northern_contingencies:0 "Map Northern Kosovo Contingencies"
 MSGA_map_northern_contingencies_desc:0 "Spend 30 PP and 21 days on staff mapping and civilian contingency planning. Gains 3 Army XP, records the northern assessment and advances the crisis review counter. No military deployment or occupation occurs. One time."
 MSGA_dossier_ready_tt:0 "The Kosovo crisis dossier is complete and retained for later policy."
 MSGA_kfor_review_tt:0 "The assessment of KFOR presence is complete and retained for later policy."
 MSGA_regional_review_tt:0 "Regional diplomatic consultations are complete and retained for later policy."
 MSGA_contingency_review_tt:0 "Northern contingency mapping is complete and retained for later policy."

 MSGA_covid.2.a:0 "Keep the wards supplied."
 MSGA_covid.2.t:0 "Hospitals Under Pressure"
 MSGA_covid.2.d:0 "Emergency appropriations are reaching hospitals from Belgrade to the smaller regional centres. New protective equipment, oxygen supplies and additional intensive-care beds give exhausted staff a little room to breathe.\n\nThese measures have prevented immediate collapse, but crowded wards remain a warning. Buying time for doctors is the first step; bringing the epidemic under control will take a broader effort."
 MSGA_covid.3.a:0 "Close the emergency programme."
 MSGA_covid.3.t:0 "The Vaccination Programme Is Complete"
 MSGA_covid.3.d:0 "Clinics have completed the national vaccination drive. Serbia can end its emergency pandemic response, including any outbreak still pending after earlier precautions."
 MSGA_economy.2.a:0 "Let the capital work."
 MSGA_economy.2.t:0 "A New Belgrade Skyline"
 MSGA_economy.2.d:0 "Cranes rise above the capital as commercial developments and modern offices replace neglected plots. Manufacturers gain new production space, while service firms begin moving into premises designed for a growing economy.\n\nCity planners warn that buildings alone cannot create prosperity. The new skyline is an opportunity to retain skilled workers and connect domestic businesses to wider markets."
 MSGA_economy.3.a:0 "Keep goods moving."
 MSGA_economy.3.t:0 "The Morava Artery"
 MSGA_economy.3.d:0 "Freight operators report shorter journeys through the Morava corridor. Better roads connect the industrial towns of central Serbia with the markets and warehouses that sustain them.\n\nFor communities along the route, the investment is visible in regular deliveries, fewer delays and renewed interest in local production."
 MSGA_economy.4.a:0 "The age of reconstruction is over."
 MSGA_economy.4.t:0 "The Recovery Is Ours"
 MSGA_economy.4.d:0 "For years, every argument about Serbia's economy returned to the destruction of the past. Damaged industry, deferred investment and the lasting scars of the bombings set limits on what governments could promise.\n\nThe reconstruction programme has now reached its conclusion. New capacity and stronger domestic networks cannot settle every dispute, but they allow Serbia to plan for growth rather than merely repair. The country has earned the right to look ahead."
 MSGA_politics.2.a:0 "Use the mandate responsibly."
 MSGA_politics.2.t:0 "The President's Mandate"
 MSGA_politics.2.d:0 "The cabinet has emerged from the confrontation in Belgrade with a clearer chain of authority. Ministers present the new mandate as a promise of continuity, while opposition leaders insist that their demands have not disappeared.\n\nWhether through restraint or a firm response, the presidency has secured room to govern. Its next test will be to turn political control into results that citizens can see."
 MSGA_military.2.a:0 "Put the supplies in trained hands."
 MSGA_military.2.t:0 "Emergency Procurement Programme"
 MSGA_military.2.d:0 "The General Staff has requested larger stockpiles as the international outlook darkens. Rifles, support equipment and transport vehicles are entering depots under an emergency procurement programme.\n\nThese deliveries will help units train and replace worn equipment. Officers remain clear that stocks and readiness are different things: supplies must be maintained, crews trained and mobilisation plans rehearsed."
 MSGA_military.3.a:0 "Then we watch."
 MSGA_military.3.t:0 "The National Security Council"
 MSGA_military.3.d:0 "The National Security Council has reviewed the results of economic reconstruction, political consolidation and army reform. Production has recovered, training is improving and the state can sustain a more serious discussion of regional security.\n\nThe General Staff recommends patience. Serbia has more options than it did at the beginning of the decade, but the strength and intentions of the powers around it still matter."
 MSGA_chronicle.2.a:0 "Take note of the report."
 MSGA_chronicle.2.t:0 "Construction Boom in Belgrade"
 MSGA_chronicle.2.d:0 "Contractors in the capital are reporting full order books. Offices, workshops and transport links are bringing a renewed rhythm to neighbourhoods that saw little investment for years.\n\nThe government can help sustain this momentum by coordinating permits and public works, while keeping expectations within the capacity of local builders."
 MSGA_chronicle.3.a:0 "Welcome the commercial payment."
 MSGA_chronicle.3.b:0 "Encourage sustained expansion."
 MSGA_chronicle.3.t:0 "Foreign Investors Court Belgrade"
 MSGA_chronicle.3.d:0 "Delegations of manufacturers and service firms have arrived with proposals for new contracts. Serbia's productive-capital programme has made the country easier to place on an investment map.\n\nThe finance ministry can welcome an immediate commercial payment or encourage a longer period of business expansion. Neither approach removes the need to examine what each investor intends to build."
 MSGA_chronicle.4.a:0 "Take note of the report."
 MSGA_chronicle.4.t:0 "Freight Traffic Surges Along the Morava"
 MSGA_chronicle.4.d:0 "Warehouse managers and hauliers report increased traffic through central Serbia. The corridor works are helping producers fulfil contracts that once seemed too vulnerable to delays.\n\nAdditional freight revenues are a modest dividend from the investment, and a reminder that infrastructure earns its value through everyday use."
 MSGA_chronicle.5.a:0 "Take note of the report."
 MSGA_chronicle.5.t:0 "A New Defence Export Contract"
 MSGA_chronicle.5.d:0 "A foreign buyer has placed a limited order with Serbian defence manufacturers. The agreement keeps specialist workshops busy and gives officers a chance to review production standards alongside factory engineers.\n\nThe contract is commercially useful without becoming a major strategic commitment. The ministry intends to keep delivery schedules separate from the army's domestic requirements."
 MSGA_chronicle.6.a:0 "Hear their representatives."
 MSGA_chronicle.6.b:0 "Keep the streets orderly."
 MSGA_chronicle.6.t:0 "Students March in Belgrade"
 MSGA_chronicle.6.d:0 "Students have assembled in the capital to demand clearer accounts of public spending and better prospects after graduation. Their banners mix local grievances with a wider frustration about the country's direction.\n\nOfficials can meet representatives or insist that demonstrations remain within agreed limits. A measured decision should keep this dispute from overwhelming the wider programme."
 MSGA_chronicle.7.a:0 "Cushion the immediate shock."
 MSGA_chronicle.7.b:0 "Let prices adjust."
 MSGA_chronicle.7.t:0 "Energy Prices Rise"
 MSGA_chronicle.7.d:0 "Higher energy quotations are reaching Serbian households and industrial buyers. Factory managers are looking again at operating costs, while ministers debate whether public support should absorb the increase.\n\nThe treasury can cushion the immediate shock or allow a short period of pressure on the civilian economy. The sums are limited, but the choice will be noticed."
 MSGA_chronicle.8.a:0 "Take note of the report."
 MSGA_chronicle.8.t:0 "Kosovo Border Incident"
 MSGA_chronicle.8.d:0 "Conflicting reports describe a brief confrontation near the Kosovo boundary. Local officials call for calm, and military liaison channels are being used to establish what happened.\n\nThe incident has renewed public attention to the unresolved question. The cabinet has issued no order for operations; its response remains a matter of preparation and restraint."
 MSGA_mass_vaccination:0 "Begin Mass Vaccination"
 MSGA_mass_vaccination_desc:0 "From 1 January 2021, commit 75 political power to a 20-day vaccination programme. Completion removes active TFR COVID case spirits, cancels a pending outbreak permanently and adds +2% stability."
 MSGA_protest_choice_tt:0 "An event offers a measured or firm response. Each choice has immediate political consequences and a distinct 180-day national spirit; both converge on the presidential mandate."
 MSGA_belgrade_fallback_tt:0 "Belgrade is unavailable: a small treasury payment substitutes for the state development reward."
 MSGA_army_doctrine_bonus:0 "Serbian Army Modernisation"
 MSGA_productive_capital:0 "Productive Capital"
 MSGA_productive_capital_desc:0 "Serbia encourages investment that connects manufacturing, services and domestic suppliers. A broader business base supports sustained income growth."
 MSGA_reopening_surge:0 "Reopening Surge"
 MSGA_reopening_surge_desc:0 "Vaccination allows shops and factories to return to regular schedules. Renewed demand temporarily lifts production and business activity."
 MSGA_hospital_mitigation:0 "Emergency Hospital Capacity"
 MSGA_hospital_mitigation_desc:0 "Emergency procurement, protective supplies and additional intensive-care beds give hospitals breathing room while the vaccination programme is prepared."
 MSGA_measured_response:0 "Measured Response"
 MSGA_measured_response_desc:0 "A restrained response has opened space for negotiation. Public confidence improves, while the cabinet must spend more effort maintaining consensus."
 MSGA_firm_response:0 "Firm State Response"
 MSGA_firm_response_desc:0 "The state has restored order and concentrated political authority. Distrust among demonstrators continues to weigh on public confidence."
 MSGA_defence_production_drive:0 "Defence Production Drive"
 MSGA_defence_production_drive_desc:0 "Specialist workshops are expanding their production lines. A temporary industrial drive supports military construction and higher output."
 MSGA_army_modernisation:0 "Army Modernisation Programme"
 MSGA_army_modernisation_desc:0 "The General Staff is improving training routines and formation organisation. This permanent programme forms the basis for later army reforms."
 MSGA_army_ready:0 "An Army Ready for the Uncertain"
 MSGA_army_ready_desc:0 "Army modernisation has matured into a readiness programme. Better organisation, disciplined training and a more responsive mobilisation system give Serbia credible options."
 MSGA_strategic_reserves:0 "Strategic Reserves"
 MSGA_strategic_reserves_desc:0 "Fuel stocks and revised supply routines provide a temporary buffer against disruption during an uncertain international period."
 MSGA_construction_boom:0 "Belgrade Construction Boom"
 MSGA_construction_boom_desc:0 "Coordinated permits and busy local contractors are sustaining a modest construction boom around Belgrade."
 MSGA_investor_interest:0 "Renewed Investor Interest"
 MSGA_investor_interest_desc:0 "New commercial contacts are giving domestic suppliers and service firms a temporary opportunity to expand."
 MSGA_energy_pressure:0 "Energy Price Pressure"
 MSGA_energy_pressure_desc:0 "Higher energy prices are raising the civilian economy's demands on industrial capacity until contracts adjust."
 MSGA_SER_streets_presidency_category_desc:0 "Domestic authority rests on the balance between public demands and presidential control. Use focused political decisions to manage that balance."
 MSGA_public_health_desc:0 "Support Serbian hospitals, then organise mass vaccination when vaccines become available. Reopening follows the completed vaccination programme."
 MSGA_economic_development_desc:0 "Fund additional commercial, transport and resource projects after the productive-capital programme begins."
 MSGA_rearmament_desc:0 "Fund further defence production and procurement alongside the army modernisation programme."
 MSGA_aleksandar_vulin_DM:0 "Aleksandar Vulin"
 MSGA_aleksandar_vulin_DM_desc:0 "Serbia's Defence Minister coordinates military administration and the modernisation of the armed forces."
 MSGA_defence_moderniser:0 "Defence Moderniser"
 MSGA_end_belgrade_blues_tt:0 "Ends the §YBelgrade Blues§! political struggle and removes its SPS influence penalties."
 MSGA_internal_investment_drive:0 "Internal Investment Drive"
 MSGA_internal_investment_drive_desc:0 "Borrow to modernise Vojvodina and expand domestic production. The campaign will improve industrial development while new commitments weigh on income growth."
 MSGA_settle_old_political_accounts:0 "Settle the Old Political Accounts"
 MSGA_settle_old_political_accounts_desc:0 "Resolve longstanding disputes within the governing coalition and establish a common programme for the institutions ahead."
 MSGA_secure_the_national_assembly:0 "Secure the National Assembly"
 MSGA_secure_the_national_assembly_desc:0 "Build dependable parliamentary support for the presidency and its programme."
 MSGA_send_the_migrants_back:0 "Send the Migrants Back"
 MSGA_send_the_migrants_back_desc:0 "Bring Serbian emigrants home through a repatriation campaign. The population and research losses will ease, although the immediate disruption will strain public confidence and army organisation."
 MSGA_serbia_stands_united:0 "Serbia Stands United"
 MSGA_serbia_stands_united_desc:0 "Turn a presidential mandate into a wider national consensus before assessing the international crisis."
 MSGA_reconstitute_serbian_volunteer_guard:0 "Reconstitute the Serbian Volunteer Guard"
 MSGA_reconstitute_serbian_volunteer_guard_desc:0 "Reconstitute the volunteer formation and deploy the Tigers. Three further formations may be raised through separate recruitment programmes."
 MSGA_internal_investment_campaign:0 "Internal Investment Campaign"
 MSGA_internal_investment_campaign_desc:0 "Debt finances a permanent domestic investment campaign. Industrial development and business value rise, while the continuing commitment weighs on income growth."
 MSGA_massive_emigration_easing:0 "Massive Emigration Problem – Easing"
 MSGA_massive_emigration_easing_desc:0 "Returning emigrants reduce the population and research penalties by half."
 MSGA_repatriation_disruption:0 "Disruption of the Repatriation Campaign"
 MSGA_repatriation_disruption_desc:0 "Organising repatriation temporarily diverts personnel and reduces army organisation for 75 days."
 MSGA_national_consensus:0 "National Consensus"
 MSGA_national_consensus_desc:0 "A broader political settlement strengthens stability, political power gain and mobilisation speed."
 MSGA_pending_outbreak:0 "A Pending Outbreak"
 MSGA_pending_outbreak_desc:0 "Public health precautions can delay the expected outbreak by 400 days in total. Completing vaccination cancels the pending outbreak permanently."
 MSGA_restrict_border_traffic:0 "Restrict Border Traffic"
 MSGA_restrict_border_traffic_desc:0 "Spend 10 PP to delay the pending outbreak by 120 days. May be used once."
 MSGA_emergency_screening:0 "Introduce Emergency Screening"
 MSGA_emergency_screening_desc:0 "Spend 15 PP to delay the pending outbreak by 130 days. May be used once."
 MSGA_public_health_controls:0 "Strengthen Public Health Controls"
 MSGA_public_health_controls_desc:0 "Spend 20 PP to delay the pending outbreak by 150 days. May be used once."
 MSGA_invest_southern_serbia:0 "Invest in Southern Serbia"
 MSGA_invest_southern_serbia_desc:0 "Commit 20 PP and exactly $1.0B of debt to a 30-day project. Completion adds two building slots and one civilian factory to the Niš state. If Serbia loses control before delivery, the nominal debt and PP are refunded and the decision remains consumed."
 MSGA_raise_scorpions:0 "Raise the Scorpions"
 MSGA_raise_scorpions_desc:0 "Finance this formation with $2.0 billion from the treasury. Deployment takes twenty days and supplies full manpower and equipment. No political power is required; this programme may be completed once."
 MSGA_raise_white_eagles:0 "Raise the White Eagles"
 MSGA_raise_white_eagles_desc:0 "Finance this formation with $2.0 billion from the treasury. Deployment takes twenty days and supplies full manpower and equipment. No political power is required; this programme may be completed once."
 MSGA_raise_serbian_guard:0 "Raise the Serbian Guard"
 MSGA_raise_serbian_guard_desc:0 "Finance this formation with $2.0 billion from the treasury. Deployment takes twenty days and supplies full manpower and equipment. No political power is required; this programme may be completed once."
 MSGA_investment_debt_tt:0 "Debt: §R+$2.0B§!."
 MSGA_northern_infrastructure_tt:0 "Vojvodina receives up to three infrastructure levels, subject to the TFR maximum of five. At the 2020 start this increases infrastructure from three to five."
 MSGA_southern_investment_refund_tt:0 "The southern project cannot be delivered. Its $1.0B nominal debt and 20 PP commitment are refunded."
 MSGA_volunteer_guard_tt:0 "Creates the Serbian Volunteer Guard template and deploys one fully equipped formation: Arkan's Tigers. Three one-time recruitment decisions can deploy three more formations, for a total of four."
 MSGA_expansion.1.t:0 "The Outbreak Reaches Serbia"
 MSGA_expansion.1.d:0 "Despite earlier precautions, local transmission is now putting the health system under pressure. The public health programme will continue until vaccination can resolve the emergency."
 MSGA_expansion.1.a:0 "Keep the clinics prepared."
 MSGA_kosovo.1.t:0 "The General Staff Presents Its Plan"
 MSGA_kosovo.1.d:0 "Maps of the administrative line cover the General Staff table. Officers outline a limited operation to establish control over Kosovo, with supply routes and the protection of civilians treated as operational necessities. The plan can proceed only after the southern command has completed its preparations."
 MSGA_kosovo.1.a:0 "Begin the preparations."
 MSGA_kosovo.2.t:0 "Troops Move South"
 MSGA_kosovo.2.d:0 "Military convoys and reserve formations move towards the southern staging areas. Fuel and ammunition are distributed, communications are tested and officers review their orders. The concentration of forces leaves little doubt about the direction of Serbian policy."
 MSGA_kosovo.2.a:0 "Everything must be ready."
 MSGA_kosovo.3.t:0 "Operation Return Begins"
 MSGA_kosovo.3.d:0 "At dawn, Serbian units receive orders to cross the administrative line. Belgrade announces that the operation seeks to restore territorial authority and instructs commanders to protect the civilian population. A dispute that diplomacy could not settle has entered a military phase."
 MSGA_kosovo.3.a:0 "The operation has begun."
 MSGA_kosovo.4.t:0 "Emergency Address to the Nation"
 MSGA_kosovo.4.d:0 "The presidency addresses Serbia as reports arrive from the south. The government describes the campaign as the restoration of constitutional authority, rather than a war against Kosovo’s civilian population. Families await news from their relatives in uniform."
 MSGA_kosovo.4.a:0 "Serbia will endure."
 MSGA_kosovo.5.t:0 "Pristina Declares General Mobilisation"
 MSGA_kosovo.5.d:0 "Pristina has declared a state of emergency. Available formations and reserves are mobilising while government offices prepare contingency arrangements. Kosovo’s authorities insist that resistance will continue despite the imbalance of forces."
 MSGA_kosovo.5.a:0 "Then they have chosen resistance."
 MSGA_kosovo.6.t:0 "NATO Calls for Restraint"
 MSGA_kosovo.6.d:0 "NATO governments condemn the escalation and demand an immediate halt to hostilities. Their statements offer little indication of a direct military response. With the alliance preoccupied by wider crises, the gap between its diplomatic position and its ability to act is visible to every capital in the region."
 MSGA_kosovo.6.a:0 "They will do nothing."
 MSGA_kosovo.7.t:0 "Pristina Has Fallen"
 MSGA_kosovo.7.d:0 "Serbian forces have entered Pristina. Kosovo’s leadership is evacuating and communications between remaining formations are becoming uncertain. The capture of the capital does not end all resistance, but it has changed the calculations in neighbouring Tirana."
 MSGA_kosovo.7.a:0 "The end is approaching."
 MSGA_kosovo.8.t:0 "Albania Enters the War"
 MSGA_kosovo.8.d:0 "Albania has entered the conflict independently after breaking with alliance policy. Tirana argues that Kosovo cannot be abandoned. Serbian commanders now face an additional front, while NATO governments stress that Albania’s decision was unilateral."
 MSGA_kosovo.8.a:0 "Then they will share Kosovo’s fate."
 MSGA_kosovo.9.t:0 "NATO Distances Itself from Tirana"
 MSGA_kosovo.9.d:0 "Alliance representatives state that Albania’s intervention was not authorised and does not invoke collective defence. Tirana’s decision will be its own responsibility. The conventional conflict remains confined to the countries already involved."
 MSGA_kosovo.9.a:0 "So we face Albania alone."
 MSGA_kosovo.10.t:0 "Kosovo Has Capitulated"
 MSGA_kosovo.10.d:0 "Kosovo’s government has collapsed and organised military resistance has ceased. Serbian authorities now control both Kosovo territories. The General Staff has been instructed to conclude the campaign and secure the ceasefire arrangements."
 MSGA_kosovo.10.a:0 "Kosovo is Serbia."
 MSGA_kosovo.11.t:0 "Tirana Requests a Ceasefire"
 MSGA_kosovo.11.d:0 "With Kosovo defeated, Tirana has requested an end to the conventional fighting. A ceasefire has already been arranged: neither country will take territory from the other. Albania remains outside NATO while the political consequences of its intervention become clear."
 MSGA_kosovo.11.a:0 "The war is over."
 MSGA_kosovo.12.t:0 "Kosovo Returns to Serbian Control"
 MSGA_kosovo.12.d:0 "Serbia has regained control of Kosovo, but victory has created a new political situation. Questions of administration, relations with neighbouring countries and Serbia’s place in Europe remain unresolved. The military campaign has ended; the next chapter will require a different programme."
 MSGA_kosovo.12.a:0 "The old order is gone."
 MSGA_kosovo.20.t:0 "Kosovo Will Not Stand Alone"
 MSGA_kosovo.20.d:0 "The fall of Pristina has forced Tirana to act. Albania has left the alliance before this decision; intervention will be an independent undertaking without a claim to collective defence. The government orders its armed forces to enter the war against Serbia."
 MSGA_kosovo.20.a:0 "Kosovo will not stand alone."
 MSGA_kosovo.21.t:0 "The Offensive Is Ready"
 MSGA_kosovo.21.d:0 "Reconnaissance reports, artillery positions and supply routes have been coordinated for the sector. Commanders can now conduct the offensive with a prepared plan."
 MSGA_kosovo.21.a:0 "Proceed with the operation."
 MSGA_plan_the_attack:0 "Plan the Attack"
 MSGA_plan_the_attack_desc:0 "The General Staff must prepare a limited operational plan, with clear objectives and reliable supply routes."
 MSGA_prepare_southern_command:0 "Prepare the Southern Command"
 MSGA_prepare_southern_command_desc:0 "Move formations and reserves into their staging areas and coordinate the southern command."
 MSGA_operation_return:0 "Operation Return"
 MSGA_operation_return_desc:0 "The preparations are complete. The government can now authorise the operation to restore control over Kosovo."
 MSGA_kosovo_has_been_retaken:0 "Kosovo Has Been Retaken"
 MSGA_kosovo_has_been_retaken_desc:0 "Military victory is confirmed only when Serbia owns and controls both Kosovo territories."
 MSGA_post_kosovo_settlement:0 "The Post-Kosovo Settlement"
 MSGA_post_kosovo_settlement_desc:0 "The military campaign has ended. A later chapter will address the political settlement and the responsibilities that follow."
 MSGA_cost_2B:0 "£GFX_dx 2.0B"
 MSGA_cost_3B:0 "£GFX_dx 3.0B"
 MSGA_cost_25CP:0 "£command_power 25"
 MSGA_kosovo_operations:0 "Kosovo Campaign"
 MSGA_kosovo_operations_desc:0 "Prepare each sector before committing formations to the offensive. Preparation costs 25 command power and takes fourteen days."
 MSGA_unprepared_sector:0 "Unprepared Sector"
 MSGA_unprepared_sector_desc:0 "Attacking formations face incomplete reconnaissance and supply preparations: division attack -30%, movement -10%."
 MSGA_southern_command_mobilised:0 "Southern Command Mobilised"
 MSGA_southern_command_mobilised_desc:0 "Coordinated staging areas and supply arrangements support the southern campaign."
 MSGA_kosovo_emergency_mobilisation:0 "Emergency Mobilisation"
 MSGA_kosovo_emergency_mobilisation_desc:0 "Kosovo has mobilised its remaining reserves to defend its territory."
 MSGA_campaign_isolation:0 "An Independent Campaign"
 MSGA_campaign_isolation_desc:0 "The government conducts this conflict outside a military alliance."
 MSGA_post_kosovo_shell_tt:0 "The next Serbian programme will be established in a later chapter."
 MSGA_prepare_offensive_785:0 "Prepare Offensive in Kosovo"
 MSGA_prepare_offensive_785_desc:0 "Spend 25 command power on fourteen days of reconnaissance, artillery coordination and supply preparations. The Unprepared Sector penalty remains until preparation is complete."
 MSGA_prepare_offensive_1305:0 "Prepare Offensive in Kosovska Mitrovica"
 MSGA_prepare_offensive_1305_desc:0 "Spend 25 command power on fourteen days of reconnaissance, artillery coordination and supply preparations. The Unprepared Sector penalty remains until preparation is complete."
