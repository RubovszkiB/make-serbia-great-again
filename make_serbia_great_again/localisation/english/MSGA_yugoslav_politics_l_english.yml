l_english:
 MSGA_yugoslavia_proclaimed:0 "Yugoslavia Proclaimed"
 MSGA_yugoslavia_proclaimed_desc:0 "The federation has been formed. Its republics now need a political settlement that can give their common institutions lasting authority."
 MSGA_future_of_the_federation:0 "The Future of the Federation"
 MSGA_future_of_the_federation_desc:0 "Three answers compete in Belgrade: socialist renewal, continuity under the existing presidency, or a national Yugoslav state. We must choose one course for the federation."
 MSGA_return_to_socialism:0 "Return to Socialism"
 MSGA_return_to_socialism_desc:0 "Ivica Dačić will lead a Yugoslav socialist party built from the existing Serbian organisation. Political mobilisation and federal solidarity will anchor the new government."
 MSGA_titos_legacy:0 "Tito’s Legacy"
 MSGA_titos_legacy_desc:0 "We will draw on Tito-era federal symbolism and the promise of a common socialist homeland, adapting that legacy to a new century."
 MSGA_socialist_yugoslavia:0 "Socialist Yugoslavia"
 MSGA_socialist_yugoslavia_desc:0 "A renewed socialist federation will combine political mobilisation with industrial cooperation and a lasting settlement between its republics."
 MSGA_keep_the_status_quo:0 "Keep the Status Quo"
 MSGA_keep_the_status_quo_desc:0 "The existing presidency will continue to guide the federation. Stability and pragmatic administration take priority over a new political order."
 MSGA_the_vucic_system:0 "The Vučić System"
 MSGA_the_vucic_system_desc:0 "The presidency will consolidate the networks of political negotiation and economic cooperation that hold the federation together."
 MSGA_a_stable_federation:0 "A Stable Federation"
 MSGA_a_stable_federation_desc:0 "Continuity has become a federal settlement. Common institutions will offer the republics predictable government and a stable foundation for development."
 MSGA_a_national_yugoslavia:0 "A National Yugoslavia"
 MSGA_a_national_yugoslavia_desc:0 "Vučić will lead a national Yugoslav government. The federation retains its constitutional identity while placing renewed emphasis on common authority and public resolve."
 MSGA_national_renewal:0 "National Renewal"
 MSGA_national_renewal_desc:0 "A programme of national renewal will strengthen public confidence, military cohesion and the authority of federal institutions."
 MSGA_national_yugoslavia:0 "National Yugoslavia"
 MSGA_national_yugoslavia_desc:0 "One Yugoslav state now speaks through a consolidated federal government. The political settlement is complete and the republics remain within the existing federation."
 MSGA_yugopolitics.1.t:0 "The Politics of the New Yugoslavia"
 MSGA_yugopolitics.1.d:0 "The federation exists, but its political character remains unsettled. Delegates arrive in Belgrade as the presidency prepares to open a debate on the future of their common state."
 MSGA_yugopolitics.1.a:0 "The political debate begins."
 MSGA_yugopolitics.2.t:0 "The Political Future of Yugoslavia"
 MSGA_yugopolitics.2.d:0 "Socialists call for solidarity and a renewed federal tradition. Supporters of the presidency argue for continuity and pragmatic government. Nationalists demand stronger common authority. The coming political programme will decide which vision prevails."
 MSGA_yugopolitics.2.a:0 "We must choose our course."
 MSGA_yugopolitics.3.t:0 "The Return of the Red Star"
 MSGA_yugopolitics.3.d:0 "The socialist leadership has adopted the red star of the historic Yugoslav tricolour. Dačić presents it as a symbol of solidarity between the republics, rather than a promise to restore every institution of the twentieth century."
 MSGA_yugopolitics.3.a:0 "A socialist homeland for a new generation."
 MSGA_yugopolitics.4.t:0 "Federal Continuity"
 MSGA_yugopolitics.4.d:0 "The presidency has secured a settlement based on continuity. Vučić remains at the head of the existing government as the republics turn toward predictable administration and economic cooperation."
 MSGA_yugopolitics.4.a:0 "The federation stands on firmer ground."
 MSGA_yugopolitics.5.t:0 "National Renewal"
 MSGA_yugopolitics.5.d:0 "The national government has launched its programme of renewal. Vučić calls for public resolve, cohesive armed forces and a common Yugoslav authority. The federation retains its constitutional name and plain tricolour."
 MSGA_yugopolitics.5.a:0 "One federation, a common purpose."
 MSGA_yugopolitics.6.t:0 "A Yugoslavia for a New Era"
 MSGA_yugopolitics.6.d:0 "The political debate has reached its conclusion. A settled government now speaks for the federation, while its constituent republics prepare for the next stage of common development."
 MSGA_yugopolitics.6.a:0 "The political settlement is complete."
 MSGA_yp_titos_legacy:0 "Tito’s Legacy"
 MSGA_yp_titos_legacy_desc:0 "We will draw on Tito-era federal symbolism and the promise of a common socialist homeland, adapting that legacy to a new century."
 MSGA_yp_renewed_socialist_federation:0 "A Renewed Socialist Federation"
 MSGA_yp_renewed_socialist_federation_desc:0 "A renewed socialist federation will combine political mobilisation with industrial cooperation and a lasting settlement between its republics."
 MSGA_yp_vucic_system:0 "The Vučić System"
 MSGA_yp_vucic_system_desc:0 "The presidency will consolidate the networks of political negotiation and economic cooperation that hold the federation together."
 MSGA_yp_federal_continuity:0 "Federal Continuity"
 MSGA_yp_federal_continuity_desc:0 "Continuity has become a federal settlement. Common institutions will offer the republics predictable government and a stable foundation for development."
 MSGA_yp_yugoslav_national_renewal:0 "Yugoslav National Renewal"
 MSGA_yp_yugoslav_national_renewal_desc:0 "A programme of national renewal will strengthen public confidence, military cohesion and the authority of federal institutions."
 MSGA_yp_one_yugoslav_state:0 "One Yugoslav State"
 MSGA_yp_one_yugoslav_state_desc:0 "One Yugoslav state now speaks through a consolidated federal government. The political settlement is complete and the republics remain within the existing federation."
