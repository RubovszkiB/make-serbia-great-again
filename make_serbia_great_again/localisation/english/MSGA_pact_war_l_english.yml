l_english:
 MSGA_montenegro_capital_resistance:0 "Resistance in the Highlands"
 MSGA_montenegro_capital_resistance_desc:0 "30-day defensive response after the loss of the capital. It does not change surrender conditions."
 MSGA_montenegro_postwar_recovery:0 "Post-War Administration"
 MSGA_montenegro_postwar_recovery_desc:0 "90-day recovery programme under Serbian protection. Existing territory and military formations remain with this country."
 MSGA_macedonia_capital_resistance:0 "Defend What Remains"
 MSGA_macedonia_capital_resistance_desc:0 "30-day defensive response after the loss of the capital. It does not change surrender conditions."
 MSGA_macedonia_postwar_recovery:0 "Government Under Serbian Protection"
 MSGA_macedonia_postwar_recovery_desc:0 "90-day recovery programme under Serbian protection. Existing territory and military formations remain with this country."
 MSGA_albania_capital_resistance:0 "War in the Highlands"
 MSGA_albania_capital_resistance_desc:0 "45-day defensive response after the loss of the capital. It does not change surrender conditions."
 MSGA_albania_postwar_recovery:0 "A Defeated Albania"
 MSGA_albania_postwar_recovery_desc:0 "120-day recovery programme under Serbian protection. Existing territory and military formations remain with this country."
 MSGA_slovenia_capital_resistance:0 "Retreat to the Alps"
 MSGA_slovenia_capital_resistance_desc:0 "30-day defensive response after the loss of the capital. It does not change surrender conditions."
 MSGA_slovenia_postwar_recovery:0 "Government of National Recovery"
 MSGA_slovenia_postwar_recovery_desc:0 "90-day recovery programme under Serbian protection. Existing territory and military formations remain with this country."
 MSGA_croatia_capital_resistance:0 "Fight Beyond Zagreb"
 MSGA_croatia_capital_resistance_desc:0 "45-day defensive response after the loss of the capital. It does not change surrender conditions."
 MSGA_croatia_postwar_recovery:0 "The Defeated Coalition Leader"
 MSGA_croatia_postwar_recovery_desc:0 "120-day recovery programme under Serbian protection. Existing territory and military formations remain with this country."
 MSGA_pact_postwar_neutrality:0 "Recovering Outside the War"
 MSGA_pact_postwar_neutrality_desc:0 "This Serbian subject remains outside the ongoing war against its former Pact allies. Faction admission is deferred until the campaign has ended."
 MSGA_pact_decline_calls:0 "Postwar military recovery"
 MSGA_highland_defence_tt:0 "Mountain defence: §G+10%§! for land battalions."
 MSGA_highland_resistance_tech:0 "Highland Resistance"
 MSGA_highland_resistance_tech_desc:0 "Temporary mountain defence attached to the capital-loss spirit. Removed when that spirit expires or the country capitulates."
 MSGA_pactwar.1.t:0 "Podgorica Has Fallen"
 MSGA_pactwar.1.d:0 "Serbian forces have taken Podgorica, displacing Montenegro’s government and disrupting command across the coastal approaches. The loss of the capital has shaken public confidence.\n\nMontenegrin formations are withdrawing into the interior. Mountain roads and prepared positions still offer space for resistance; the country remains at war."
 MSGA_pactwar.1.a:0 "The mountains remain."
 MSGA_pactwar.2.t:0 "Podgorica Submits"
 MSGA_pactwar.2.d:0 "Montenegro’s armed resistance has ended in a formal capitulation. The administration in Podgorica has accepted Serbian protection, and Montenegro leaves the war as a separate state under Belgrade’s authority.\n\nRecovery takes precedence over another campaign. Its surviving forces remain Montenegrin, while the other Pact members continue their own resistance."
 MSGA_pactwar.2.a:0 "Establish the post-war administration."
 MSGA_pactwar.3.t:0 "Skopje Has Fallen"
 MSGA_pactwar.3.d:0 "The fall of Skopje has broken the government’s hold on the central Vardar corridor. Communications with the southern defensive line are under increasing pressure.\n\nNorth Macedonian units continue to defend the remaining routes and towns. The capital’s loss is a serious setback, but no surrender has been agreed."
 MSGA_pactwar.3.a:0 "The Vardar front remains active."
 MSGA_pactwar.4.t:0 "Skopje Accepts Serbian Terms"
 MSGA_pactwar.4.d:0 "North Macedonia has capitulated after the collapse of organised resistance. Skopje has accepted a government under Serbian protection and withdrawn from the Zagreb–Tirana Pact’s war.\n\nThe country retains its administration, territory and surviving military formations. Belgrade will supervise recovery while the remaining enemy governments continue fighting."
 MSGA_pactwar.4.a:0 "Secure the southern settlement."
 MSGA_pactwar.5.t:0 "Tirana Has Fallen"
 MSGA_pactwar.5.d:0 "Tirana has fallen to the Serbian side. Albania’s leadership has lost its principal political centre, as the campaign along the Kosovo frontier places further pressure on its remaining positions.\n\nAlbanian units are falling back towards the highlands. The war continues beyond the capital, and Serbia’s control of Kosovo remains unchanged."
 MSGA_pactwar.5.a:0 "The highlands still hold resistance."
 MSGA_pactwar.6.t:0 "Tirana Accepts the New Order"
 MSGA_pactwar.6.d:0 "Albania has formally capitulated. The authorities in Tirana have accepted Serbian overlordship, ending Albania’s participation in the Pact’s war without dissolving the Albanian state.\n\nIts surviving forces and home territory remain Albanian. Reconstruction will proceed under Serbian protection, while Kosovo remains under Serbian ownership and control."
 MSGA_pactwar.6.a:0 "Confirm the new administration."
 MSGA_pactwar.7.t:0 "Ljubljana Has Fallen"
 MSGA_pactwar.7.d:0 "Ljubljana has been occupied, severing the Slovenian government from its main administrative centre. The northern front now turns towards the approaches to the Alps.\n\nSlovenian formations are regrouping along mountain routes and defensive positions. The government has lost its capital, but the country has not yet capitulated."
 MSGA_pactwar.7.a:0 "The northern front continues."
 MSGA_pactwar.8.t:0 "Ljubljana Seeks Terms"
 MSGA_pactwar.8.d:0 "Slovenia’s remaining resistance has ended in capitulation. Ljubljana has accepted Serbian protection, leaving the enemy alliance and its active war participation.\n\nA government of national recovery will retain Slovenia’s territory and surviving forces. The Alpine settlement does not end the campaigns against the remaining Pact members."
 MSGA_pactwar.8.a:0 "Begin national recovery."
 MSGA_pactwar.9.t:0 "Zagreb Has Fallen"
 MSGA_pactwar.9.d:0 "Zagreb, the political centre of the Zagreb–Tirana Pact, has fallen. The occupation has dealt a major blow to Croatian command and to the coalition’s confidence.\n\nCroatian forces continue fighting beyond the capital. The Pact’s remaining members are still in the field; taking Zagreb has settled neither Croatia’s surrender nor the wider war."
 MSGA_pactwar.9.a:0 "The Pact’s capital has fallen. The war has not."
 MSGA_pactwar.10.t:0 "The Leader of the Pact Falls"
 MSGA_pactwar.10.d:0 "Croatia has capitulated and accepted Serbian overlordship. The government that led the Zagreb–Tirana Pact leaves the coalition’s war, while the Croatian state and its surviving forces remain in place.\n\nCroatia enters a period of supervised recovery. Any Pact members still resisting Serbia continue their campaigns independently; the coalition is defeated only when all five have submitted."
 MSGA_pactwar.10.a:0 "Place Croatia under Serbian protection."
 MSGA_pactwar.11.t:0 "The Balkan Coalition Defeated"
 MSGA_pactwar.11.d:0 "All five Zagreb–Tirana Pact governments have capitulated and entered Serbian subject status. No member remains in the coalition’s war against Serbia.\n\nBelgrade now oversees five separate administrations across the region. Recovery begins within the existing settlement; this announcement creates no territorial annexation or new political programme."
 MSGA_pactwar.11.a:0 "Confirm the end of the coalition war."
