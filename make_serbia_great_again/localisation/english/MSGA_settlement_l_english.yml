 MSGA_bosnia.10.t:0 "The New Order in Bosnia"
 MSGA_bosnia.10.d:0 "Sarajevo has accepted defeat. Central Bosnia, Herzegovina and Republika Srpska now retain separate administrations under Serbian protection. The fighting ends as Belgrade assumes responsibility for the settlement."
 MSGA_bosnia.10.a:0 "Three administrations, one settlement."
 MSGA_bosnia.11.t:0 "The Question of Republika Srpska"
 MSGA_bosnia.11.d:0 "Seventy days after the settlement, Belgrade must decide whether Srpska should remain a protected republic or unite with Serbia. Unification will add $1B to national debt; it will not create new Serbian cores."
 MSGA_bosnia.11.a:0 "Unite Republika Srpska with Serbia"
 MSGA_bosnia.11.b:0 "Not Yet"
 MSGA_postkosovo.9.b:0 "Invite Serbian Private Capital"
 MSGA_postkosovo.15.t:0 "Kosovo Rebuilt"
 MSGA_postkosovo.15.d:0 "The final reconstruction programme has restored local services and expanded Kosovo’s infrastructure. Emergency reconstruction measures can now end."
 MSGA_postkosovo.15.a:0 "A new chapter begins."
 MSGA_finish_kosovo_reconstruction:0 "Complete the Reconstruction of Kosovo"
 MSGA_finish_kosovo_reconstruction_desc:0 "Spend 50 political power and $1B from the treasury to add 5% industrial development and one infrastructure level, up to the state limit. Both reconstruction focuses must be complete. Emergency reconstruction modifiers are removed."
 MSGA_cost_1B:0 "§Y$1B§!"
 MSGA_kosovo_reconstruction_state:0 "Kosovo Reconstruction"
 MSGA_kosovo_development_program:0 "Kosovo Development Programme"
 MSGA_kosovo_development_program_desc:0 "A temporary programme adds 0.5% industrial development each month for 180 days."
 MSGA_pristina_private_capital:0 "Serbian Capital in Pristina"
 MSGA_pristina_private_capital_desc:0 "Commercial investment raises business value by 5% and monthly income growth by 2%."
