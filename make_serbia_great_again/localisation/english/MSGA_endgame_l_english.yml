l_english:
 MSGA_eg_autonomy_tt:0 "Common administration and command"
 MSGA_endgame.1.t:0 "The Future of the South Slavs"
 MSGA_endgame.1.d:0 "The Balkan war and the first reconstruction programme are over. Belgrade now governs a regional system of Serbian lands and protected neighbours, but victory has left the constitutional question unanswered.\n\nA consolidated Serbian state would unite Montenegro and Macedonia with Serbia, Kosovo and the already integrated Republika Srpska. A Yugoslav federation would instead establish six constituent republics under a common presidency and army. Albania remains outside either political union."
 MSGA_endgame.1.a:0 "We must choose the shape of the new order."
 MSGA_endgame.2.t:0 "The Serbian Century"
 MSGA_endgame.2.d:0 "Belgrade has chosen a Serbian national project after the defeat of the Zagreb–Tirana Pact. The government will negotiate direct integration with Montenegro and Macedonia while retaining Croatia, Slovenia, Albania and the other protected administrations as separate states.\n\nThe campaign begins with a temporary programme of political mobilisation, industrial coordination and administrative confidence. The existing leader remains in office. Kosovo and the already annexed Republika Srpska form part of Serbia; no new Srpska annexation process is opened."
 MSGA_endgame.2.a:0 "One Serbian state, one Serbian future."
 MSGA_endgame.3.t:0 "Belgrade and Podgorica Open Union Talks"
 MSGA_endgame.3.d:0 "Representatives from Belgrade and Podgorica have opened negotiations over a common state. The first agreements concern public administration, security responsibilities and the status of local services during the transition.\n\nUnion will require separate administrative and military agreements before Montenegro can be integrated. The talks improve confidence and reduce dependence on the remaining protectorate institutions. Montenegro continues to exist until the final timed agreement is completed."
 MSGA_endgame.3.a:0 "There will be one state."
 MSGA_endgame.4.t:0 "The Cost of Union"
 MSGA_endgame.4.d:0 "The negotiators have agreed on union, but municipal payrolls, pensions and public services do not merge themselves. Montenegro’s obligations must be recognised before Belgrade can assume responsibility for its administration.\n\nThe transition requires another $0.25 billion in national debt. The commitment funds administrative continuity and reassurance for local communities; it is additional to the integration decision’s borrowing."
 MSGA_endgame.4.a:0 "Belgrade will pay the bill."
 MSGA_endgame.5.t:0 "The Montenegrin Army Takes the Serbian Oath"
 MSGA_endgame.5.d:0 "The Montenegrin command has accepted a common military chain of responsibility. Training and staff procedures will be coordinated with Belgrade, and the existing formations will retain their identity within the enlarged force.\n\nThe political oath prepares integration rather than creating new units. At the final union, the native annexation system will transfer the surviving army and its stockpile. The same formations will not be spawned a second time."
 MSGA_endgame.5.a:0 "One command. One army."
 MSGA_endgame.6.t:0 "Montenegro Joins Serbia"
 MSGA_endgame.6.d:0 "The final union agreement has entered into force. Montenegro’s administration and surviving armed forces have been integrated with Serbia, and its native territory is recognised as part of the common state.\n\nPodgorica receives an industrial expansion through the native building system. The government celebrates a completed political settlement with renewed stability and public confidence. The integration chain is closed, so its rewards and borrowing cannot be collected again."
 MSGA_endgame.6.a:0 "The union is complete."
 MSGA_endgame.7.t:0 "Belgrade Arrives in Skopje"
 MSGA_endgame.7.d:0 "The Vardar administration has opened in Skopje. Serbian and Macedonian officials are coordinating public services and security while the country remains a separate protected state during negotiations.\n\nConfidence in the southern programme improves, but the economic and military agreements still lie ahead. A lasting integration must connect transport, support local industry and reconcile the command structures before the final territorial union."
 MSGA_endgame.7.a:0 "Establish the Vardar administration."
 MSGA_endgame.8.t:0 "The Price of the Southern Integration"
 MSGA_endgame.8.d:0 "Macedonia’s economy faces years of deferred maintenance and incompatible administrative procedures. The southern integration cannot succeed through proclamations alone; it must connect transport, taxation and public services.\n\nA further $0.25 billion of national debt will finance the transition. This commitment is separate from the economic decision’s cost, and local confidence will rise as the programme becomes tangible."
 MSGA_endgame.8.a:0 "Investment today, unity tomorrow."
 MSGA_endgame.9.t:0 "Skopje's Security Apparatus Answers to Belgrade"
 MSGA_endgame.9.d:0 "Skopje’s security institutions have accepted a common framework under Belgrade’s strategic authority. Local officials will retain their administrative knowledge while sharing intelligence and coordinating public order.\n\nThe agreement reduces resistance to the transition and improves stability. It does not itself annex Macedonia. The army still requires its own command agreement before the final integration decision can complete the Vardar programme."
 MSGA_endgame.9.a:0 "One security framework for the Vardar."
 MSGA_endgame.10.t:0 "One Southern Command"
 MSGA_endgame.10.d:0 "The Macedonian military has agreed to place strategic command under Belgrade. Common staff work and training now connect the Vardar formations to the wider Serbian defence system.\n\nThe surviving army and equipment remain intact. Their transfer is reserved for the final native integration, avoiding duplicate formations or stockpiles. Staff experience gained through the agreement will support the eventual unified command."
 MSGA_endgame.10.a:0 "The army will answer to Belgrade."
 MSGA_endgame.11.t:0 "The Vardar Is Integrated"
 MSGA_endgame.11.d:0 "Macedonia’s complete administrative, economic, security and military programme has finished. The Vardar territory and its surviving forces now form part of Serbia under the final union agreement.\n\nSkopje receives a military-industrial expansion through the native building system. Stability and war support rise as the government presents the southern integration as a lasting settlement. Montenegro and Macedonia can now be consolidated within the Greater Serbian State."
 MSGA_endgame.11.a:0 "The southern integration is complete."
 MSGA_endgame.12.t:0 "The Serbian Question Settled"
 MSGA_endgame.12.d:0 "The Montenegro and Macedonia programmes have reached their conclusion. Serbia now combines its existing lands, Kosovo and the previously annexed Republika Srpska with the two newly integrated territories.\n\nTemporary project institutions give way to a unified Serbian administration. The government can now proclaim the formal identity of the Greater Serbian State, while the remaining Balkan protectorates continue to exist outside its borders."
 MSGA_endgame.12.a:0 "Consolidate the Serbian lands."
 MSGA_endgame.13.t:0 "The Greater Serbian State"
 MSGA_endgame.13.d:0 "Montenegro and Macedonia have completed their integration programmes. Kosovo and the previously annexed Republika Srpska remain within Serbia, and the unified administration now covers the lands promised by the Serbian national project.\n\nThe country takes the formal name Greater Serbian State. Aleksandar Vučić remains its leader and Belgrade its capital. Croatia, Slovenia, Albania and the remaining protectorates retain their separate administrations outside the enlarged state."
 MSGA_endgame.13.a:0 "A greater Serbian state has been proclaimed."
 MSGA_endgame.14.t:0 "The Price of Victory"
 MSGA_endgame.14.d:0 "At least $5 billion in new integration obligations has been incurred since the South Slavic project began. National debt has risen through the ordinary TFR budget system, and every agreement now competes for administrative capacity.\n\nVictory created political opportunities; implementing them carries a lasting price. The public is beginning to feel that burden. This reckoning changes neither the treasury nor the debt already recorded, and it will not be repeated."
 MSGA_endgame.14.a:0 "We knew victory would not be cheap."
 MSGA_endgame.15.t:0 "The Yugoslav Idea"
 MSGA_endgame.15.d:0 "Belgrade has chosen a constitutional Yugoslav project. Serbia will negotiate with Croatia, Slovenia, Bosnia and Herzegovina, Montenegro and Macedonia to create six constituent republics within a common state.\n\nLocal legislatures, cultural administration and negotiated economic guarantees will coexist with federal defence and foreign policy. The existing leader remains in office. This is a modern political settlement without socialist institutions; Albania remains a separate client beyond the federation."
 MSGA_endgame.15.a:0 "A common state for the South Slavs."
 MSGA_endgame.16.t:0 "The Croatian Delegation Arrives in Belgrade"
 MSGA_endgame.16.d:0 "The Croatian delegation has arrived with a demand for more than a new name above the same protectorate administration. Zagreb asks for a constituent republic, a local legislature and guarantees of cultural autonomy.\n\nBelgrade will accept these federal rights. Implementing the agreement adds $0.25 billion in national debt beyond the talks’ initial cost, and improves confidence in the federal project."
 MSGA_endgame.16.a:0 "Guarantee Croatian Federal Rights."
 MSGA_endgame.17.t:0 "Zagreb Demands Guarantees"
 MSGA_endgame.17.d:0 "Zagreb’s representatives insist that the federation must recognise Croatian cultural life and permit an elected local legislature. Defence and foreign policy may be federal, but everyday civil administration must belong to the republic.\n\nBelgrade accepts these terms. The agreement recognises Croatia as a constituent republic rather than an occupied district, providing the legal foundation for the next stage of federal reconciliation."
 MSGA_endgame.17.a:0 "Accept the Croatian federal guarantees."
 MSGA_endgame.18.t:0 "Ljubljana Accepts the Federation"
 MSGA_endgame.18.d:0 "Ljubljana has accepted constituent republic status after receiving guarantees of economic autonomy. Slovenian institutions will participate in a common market while retaining a meaningful role in local economic administration.\n\nThe agreement records Slovenia as ready for the constitutional conference. It does not yet annex the republic: all five partner administrations must be prepared, and the federal constitution must be ratified before the final proclamation."
 MSGA_endgame.18.a:0 "Protect Slovenian economic autonomy."
 MSGA_endgame.19.t:0 "The Borders of Bosnia"
 MSGA_endgame.19.d:0 "Sarajevo’s delegates have raised the boundaries of the future Bosnian republic. Republika Srpska’s three native territories were already annexed into Serbia under the earlier settlement. Their position must now be written into the federal arrangement.\n\nThe preferred settlement keeps these territories in the Serbian constituent republic. Alternatively, Belgrade may return only those previously annexed territories to Bosnia and Herzegovina, gaining stronger reconciliation at the cost of nationalist support. Neither option transfers unrelated Serbian land."
 MSGA_endgame.19.a:0 "Srpska Remains With Serbia"
 MSGA_endgame.19.b:0 "Restore the Old Bosnian Borders"
 MSGA_endgame.20.t:0 "Montenegro Chooses Yugoslavia"
 MSGA_endgame.20.d:0 "Podgorica has accepted the Yugoslav project after negotiations over Montenegrin statehood. Montenegro will enter the common state as a constituent republic, rather than first being annexed through the Serbian national integration route.\n\nThe republic is now ready for the constitutional settlement. Its existing army and equipment will transfer once, during the final federal proclamation. Local identity and administration will remain recognised within the common constitutional framework."
 MSGA_endgame.20.a:0 "Guarantee Montenegrin statehood."
 MSGA_endgame.21.t:0 "Skopje Accepts the Yugoslav Project"
 MSGA_endgame.21.d:0 "Skopje’s delegates have accepted a federal settlement that guarantees Macedonian identity and republic status. The agreement recognises local cultural and administrative institutions alongside common defence and foreign policy.\n\nMacedonia is now ready for the federal constitution. It remains a separate protected administration until the joint proclamation, when the surviving armed forces and equipment will be integrated through the native transfer system."
 MSGA_endgame.21.a:0 "Recognise Macedonia as a constituent republic."
 MSGA_endgame.22.t:0 "The Belgrade Conference"
 MSGA_endgame.22.d:0 "Delegations from Serbia, Croatia, Slovenia, Bosnia and Herzegovina, Montenegro and Macedonia have gathered in Belgrade. Their negotiated guarantees have created the foundation for a state that can replace the wartime protectorate system.\n\nThe conference will determine the strength of the presidency, confirm one federal army and establish the capital. Kosovo remains within Serbia, and Republika Srpska follows the border settlement already chosen. Albania is not a constituent republic."
 MSGA_endgame.22.a:0 "The delegations will establish the federal settlement."
 MSGA_endgame.23.t:0 "How Strong Should Belgrade Be?"
 MSGA_endgame.23.d:0 "The constitutional committee agrees on a common state but differs over its centre. A strong federal presidency would leave Belgrade with a clear mandate over defence, diplomacy and strategic finance.\n\nA balanced federation would provide greater space for republic institutions and local administration. Both choices preserve Aleksandar Vučić as the national leader and keep the country united; they establish different guarantees within the same six-republic framework."
 MSGA_endgame.23.a:0 "A Strong Federal Presidency"
 MSGA_endgame.23.b:0 "A Balanced Federation"
 MSGA_endgame.24.t:0 "One Army or Six?"
 MSGA_endgame.24.d:0 "A federation cannot retain six rival chains of military command. The delegates will preserve regional identities within a common force while placing defence planning, mobilisation and strategic procurement under federal authority.\n\nExisting formations and equipment will pass through the native integration process. No duplicate armies will be created, and no republic will field an independent force outside the federal command."
 MSGA_endgame.24.a:0 "The Army Must Be Federal"
 MSGA_endgame.25.t:0 "The Federal Capital"
 MSGA_endgame.25.d:0 "The conference has confirmed Belgrade as the capital of the new federation. Federal institutions will operate from the existing Serbian capital while each constituent republic maintains its local administration and legislature.\n\nWith the presidency and common army settled, the conference can close. The capital receives development capacity and the constitutional decision becomes available once its focus is complete. No alternate capital or change of national leader is introduced."
 MSGA_endgame.25.a:0 "Belgrade Shall Remain the Capital"
 MSGA_endgame.26.t:0 "The Constitution of the New Yugoslavia"
 MSGA_endgame.26.d:0 "The constitution recognises the republics of Serbia, Croatia, Slovenia, Bosnia and Herzegovina, Montenegro and Macedonia. Local legislatures and cultural administration coexist with common foreign policy, defence, strategic industry and federal finance.\n\nKosovo remains within Serbia and is not a separate republic. Republika Srpska follows the earlier border agreement and normally remains within the Serbian constituent republic. The federation is a contemporary constitutional project, without socialist institutions or symbolism."
 MSGA_endgame.26.a:0 "Six republics, one federal constitution."
 MSGA_endgame.27.t:0 "A New Yugoslavia Is Born"
 MSGA_endgame.27.d:0 "The negotiated integration of the five partner republics is complete. Their surviving armies, equipment, factories and territories are incorporated through the native transfer system, and the six-republic constitution now applies to a single federal state.\n\nThe country becomes the Federal Republic of Yugoslavia, under Aleksandar Vučić, with Belgrade as capital and a plain blue-white-red flag. Kosovo remains within Serbia; Albania survives as a separate Serbian client outside the federation."
 MSGA_endgame.27.a:0 "Proclaim the Federal Republic of Yugoslavia."
 MSGA_endgame.28.t:0 "Brotherhood Reforged"
 MSGA_endgame.28.d:0 "The federal settlement is moving from treaties into schools, workplaces and public services. Communities that fought against one another must now learn to trust common institutions without surrendering their cultural identities.\n\nBrotherhood here means civic reconciliation among the South Slavic peoples. It carries no socialist programme: regional identities remain recognised, public administration serves all six republics, and the federal army provides a common guarantee of security."
 MSGA_endgame.28.a:0 "Reconciliation will be built in everyday life."
 MSGA_endgame.29.t:0 "A Yugoslavia for a New Era"
 MSGA_endgame.29.d:0 "The military command has been unified and the common market rebuilt. Investment is reaching the major regions of the federation, and the constitutional guarantees negotiated in Belgrade now support a functioning common state.\n\nThe Federal Republic of Yugoslavia enters a new era under its existing leadership. The plain blue-white-red tricolour represents a modern federation of six republics, with Albania outside its borders and no further war imposed by this settlement."
 MSGA_endgame.29.a:0 "The federation has found its future."
 MSGA_endgame.30.t:0 "One People, One State"
 MSGA_endgame.30.d:0 "The Montenegrin political programme has affirmed the principle of one common administration. Belgrade presents the negotiations as a union of institutions and communities rather than a continuing wartime occupation.\n\nWhere Montenegro remains under Serbian protection, confidence and administrative cooperation improve. The final territorial integration still follows the approved timed decision chain, with its full financial obligations and safe transfer of the surviving army."
 MSGA_endgame.30.a:0 "The political union will become a common administration."
 MSGA_endgame.31.t:0 "One Yugoslav Army"
 MSGA_endgame.31.d:0 "The republic formations now serve within a single federal army. Their surviving units and stockpiles transferred at the proclamation, preserving regional experience while establishing one strategic command.\n\nThe next programmes will unify the staff structures and expand the federal arsenal. No second army or replacement stockpile is created by this announcement; the command reform develops the forces the federation already possesses."
 MSGA_endgame.31.a:0 "One federal army, one common command."
