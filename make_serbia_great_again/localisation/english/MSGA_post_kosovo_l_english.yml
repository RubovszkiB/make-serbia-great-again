l_english:
 MSGA_restore_order_in_kosovo:0 "Restore Order in Kosovo"
 MSGA_restore_order_in_kosovo_desc:0 "The army has won the war. The government must now win the peace. Roads must reopen, police must return and the northern municipalities must resume ordinary life under Serbian law."
 MSGA_review_kosovo_administration:0 "Review the Kosovo Administration"
 MSGA_review_kosovo_administration_desc:0 "Civil servants, schools, hospitals and police stations cannot be integrated by military orders alone. A joint ministerial review will establish the financial and administrative commitments required for permanent government."
 MSGA_consolidate_serbian_authority:0 "Consolidate Serbian Authority"
 MSGA_consolidate_serbian_authority_desc:0 "Kosovo must be governed through the same institutions as the rest of Serbia. Military necessity will give way to courts, municipalities and accountable civilian administration."
 MSGA_rebuild_kosovo:0 "Rebuild Kosovo"
 MSGA_rebuild_kosovo_desc:0 "The fighting left damaged roads, unreliable electricity and shuttered workplaces. Reconstruction must restore the foundations on which daily life and lasting stability depend."
 MSGA_invest_in_pristina:0 "Invest in Pristina"
 MSGA_invest_in_pristina_desc:0 "Pristina needs more than repaired buildings. Banking, offices, telecommunications and commercial links can reconnect the city to the Serbian economy and give private investment a reason to return."
 MSGA_a_lasting_peace:0 "A Lasting Peace"
 MSGA_a_lasting_peace_desc:0 "The territory has been secured, administration restored and reconstruction begun. Kosovo can finally become an integrated part of the Serbian state, even as reconciliation remains the work of years."
 MSGA_the_serbian_question:0 "The Serbian Question"
 MSGA_the_serbian_question_desc:0 "Victory has transformed Serbia’s position in the Balkans. Belgrade has shown that arrangements once considered permanent can change. Beyond the Drina, others are beginning to reconsider their own political future."
 MSGA_postkosovo.1.t:0 "The Morning After Victory"
 MSGA_postkosovo.1.d:0 "The guns have largely fallen silent. Serbian troops hold the main roads, towns and administrative centres. Yet local institutions have broken down, families have fled their homes and armed remnants still threaten public order. The army won the war; the government must now win the peace."
 MSGA_postkosovo.1.a:0 "Restore order before anything else."
 MSGA_postkosovo.2.t:0 "The Northern Municipalities"
 MSGA_postkosovo.2.d:0 "The northern municipalities retain close links to Serbian institutions. Local officials have begun coordinating policing, public services and municipal administration with Belgrade. Their return to ordinary Serbian government offers a first foothold for a much larger task."
 MSGA_postkosovo.2.a:0 "Welcome them home."
 MSGA_postkosovo.3.t:0 "The Cost of Integration"
 MSGA_postkosovo.3.d:0 "The ministries have delivered their assessment. Salaries, policing, healthcare, education and damaged infrastructure demand an immediate financial commitment. The government proposes borrowing $1 billion to bring Kosovo’s remaining institutions into the Serbian state. The expense cannot be postponed if integration is to last."
 MSGA_postkosovo.3.a:0 "Pay whatever it takes."
 MSGA_postkosovo.4.t:0 "One Law, One Administration"
 MSGA_postkosovo.4.d:0 "Tax offices, schools, hospitals and police departments are receiving instructions from Serbian ministries. The legal settlement is now clear; the difficult work of applying it consistently has only begun."
 MSGA_postkosovo.4.a:0 "The transition has begun."
 MSGA_postkosovo.5.t:0 "From Military Rule to Civil Government"
 MSGA_postkosovo.5.d:0 "Commanders are transferring responsibility for ordinary government to civilian officials. Military patrols remain where needed, but courts, police and municipal services will carry the burden of maintaining Serbian authority."
 MSGA_postkosovo.5.a:0 "The war is over. Governance begins."
 MSGA_postkosovo.6.t:0 "The Kosovo Question"
 MSGA_postkosovo.6.d:0 "For decades Kosovo dominated Serbian politics as a territory beyond Belgrade’s control. The question has changed. Serbia must now make its administration durable, its services dependable and its promises credible."
 MSGA_postkosovo.6.a:0 "Then we must make it permanent."
 MSGA_postkosovo.7.t:0 "Reconstruction Begins"
 MSGA_postkosovo.7.d:0 "Engineers and construction crews are reopening routes damaged during the fighting. Electricity lines, public buildings and local workplaces are being repaired. Each restored service gives residents another reason to return to daily life."
 MSGA_postkosovo.7.a:0 "Build what the war destroyed."
 MSGA_postkosovo.8.t:0 "Contracts for Reconstruction"
 MSGA_postkosovo.8.d:0 "Reconstruction contracts are drawing companies and workers into the province. Ministries have instructed contractors to prioritise practical repairs and reliable services. The first measure of success will be functioning roads, homes and workplaces."
 MSGA_postkosovo.8.a:0 "Prioritise rapid reconstruction."
 MSGA_postkosovo.9.t:0 "Investors Return to Pristina"
 MSGA_postkosovo.9.d:0 "Businesses from central Serbia are opening offices and seeking local partners in Pristina. Improved security has made investment possible, but confidence will depend on predictable administration and a sustained commercial connection with the rest of the country."
 MSGA_postkosovo.9.a:0 "Integration must bring prosperity."
 MSGA_postkosovo.10.t:0 "A City Reconnected"
 MSGA_postkosovo.10.d:0 "Pristina is reconnecting to Serbian banking, telecommunications, transport and commercial networks. The recovery is uneven, but new businesses and repaired infrastructure are creating opportunities beyond the immediate task of reconstruction."
 MSGA_postkosovo.10.a:0 "Pristina has a future within Serbia."
 MSGA_postkosovo.11.t:0 "The New Kosovo"
 MSGA_postkosovo.11.d:0 "Months ago, Serbian soldiers entered Kosovo under fire. Today, police patrol its roads, ministries administer its towns and companies invest in its economy. Resentment has not disappeared and the transformation remains incomplete. Yet the immediate postwar crisis has passed."
 MSGA_postkosovo.11.a:0 "One question has finally been answered."
 MSGA_postkosovo.12.t:0 "A New Balance in the Balkans"
 MSGA_postkosovo.12.d:0 "Serbia’s victory has changed the regional balance. Albania’s intervention failed to prevent the outcome, while NATO avoided direct involvement. Governments across the Balkans are reassessing a Serbia whose political confidence and military prestige have grown."
 MSGA_postkosovo.12.a:0 "The Balkans have changed."
 MSGA_postkosovo.13.t:0 "Voices Across the Drina"
 MSGA_postkosovo.13.d:0 "Across the Drina, Serbia’s victory has energised nationalist political circles in Republika Srpska. Voices that once demanded greater autonomy are questioning whether Bosnia’s constitutional settlement must remain permanent. Belgrade has made no commitment, but it is listening."
 MSGA_postkosovo.13.a:0 "We are listening."
 MSGA_postkosovo.14.t:0 "Perhaps Kosovo Was Only the Beginning"
 MSGA_postkosovo.14.d:0 "Kosovo’s return has challenged an assumption of the post-Yugoslav order: that borders and political arrangements could never again change. Serbia is stronger and more confident than before the war. For those who look toward Belgrade, the Serbian question remains unfinished."
 MSGA_postkosovo.14.a:0 "The Serbian question remains unfinished."
 MSGA_kosovo_integration:0 "Kosovo Integration"
 MSGA_kosovo_integration_desc:0 "Regularise local forces and complete Kosovo’s incorporation into Serbian institutions."
 MSGA_integrate_kosovo_serb_militias:0 "Integrate the Kosovo Serb Militias"
 MSGA_integrate_kosovo_serb_militias_desc:0 "Spend $2 billion from the treasury to regularise local formations as the Kosovska Mehanizovana Brigada. The brigade combines two motorized militia battalions with BVP M-80A infantry fighting vehicles, BTR-80A armoured personnel carriers and a reserve T-55A tank company, supported by engineers and logistics. Personnel and equipment are provided directly to one formation. No political power is required."
 MSGA_bosnian_crisis:0 "The Bosnian Crisis"
 MSGA_bosnian_crisis_desc:0 "Political demands across the Drina are beginning to reshape regional debate. The next chapter awaits."
 MSGA_bosnian_crisis_tt:0 "The Bosnian question has entered Serbia’s political agenda."
