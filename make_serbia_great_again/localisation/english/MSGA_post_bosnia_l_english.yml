l_english:
 MSGA_victory_in_bosnia:0 "Victory in Bosnia"
 MSGA_victory_in_bosnia_desc:0 "Consolidate the victory with 5% stability and 25 political power. Temporary local war measures end."
 MSGA_rebuild_the_west:0 "Rebuild the West"
 MSGA_rebuild_the_west_desc:0 "Add 5% industrial-development progress and capped infrastructure in western Serbia. Eligible western and protectorate states receive 180 days of 10% construction and 20% building repair bonuses."
 MSGA_new_serbian_era:0 "A New Serbian Era"
 MSGA_new_serbian_era_desc:0 "Gain 25 political power and open the military, political and economic programmes."
 MSGA_lessons_bosnian_war:0 "Lessons of the Bosnian War"
 MSGA_lessons_bosnian_war_desc:0 "Gain 25 army experience, one 25% land-doctrine cost reduction and 180 days of 5% planning speed."
 MSGA_arm_new_serbian_sphere:0 "Arm the New Serbian Sphere"
 MSGA_arm_new_serbian_sphere_desc:0 "Unlock two Bosnian and two Herzegovinian territorial brigades. Each regional decision costs 25 PP and $0.25B treasury. All formations serve directly under Serbian command."
 MSGA_serbian_defence_network:0 "The Serbian Defence Network"
 MSGA_serbian_defence_network_desc:0 "Unlock the Srpska Territorial Defence: one mobile formation based on the Kosovo brigade, costing $0.5B treasury and no PP. It remains under Serbian command before and after Srpska annexation."
 MSGA_consolidate_victory:0 "Consolidate the Victory"
 MSGA_consolidate_victory_desc:0 "Gain 5% stability and 50 political power. Move the existing balance of power 10% toward the presidency."
 MSGA_bind_new_protectorates:0 "Bind the New Protectorates"
 MSGA_bind_new_protectorates_desc:0 "Improve the remaining BOS, HRZ and SRP subjects’ opinion by 25 and reduce autonomy growth by 10%. Annexed Srpska is safely skipped."
 MSGA_serbian_sphere:0 "The Serbian Sphere"
 MSGA_serbian_sphere_desc:0 "Gain 5% political power, 3% stability and 10% trade opinion. Remaining Balkan protectorates receive 10% lower autonomy and trade-autonomy growth."
 MSGA_repair_war_economy:0 "Repair the War Economy"
 MSGA_repair_war_economy_desc:0 "Reduce national debt by up to $0.5B without creating negative debt. Add 5% industrial-development progress and a temporary 1% income growth bonus."
 MSGA_serbian_industrial_consolidation:0 "Serbian Industrial Consolidation"
 MSGA_serbian_industrial_consolidation_desc:0 "Build two civilian factories and one office park in Belgrade, with a controlled Serbian state as fallback. Add 5% industrial-development progress."
 MSGA_economic_heart_balkans:0 "The Economic Heart of the Balkans"
 MSGA_economic_heart_balkans_desc:0 "Gain 2% lower consumer goods factor, 5% factory output, 5% business value and 2% monthly income growth. Complete all three branches to become a regional power."
 MSGA_postbosnia.1.t:0 "Victory in Bosnia"
 MSGA_postbosnia.1.d:0 "Bosnia has accepted defeat. Republika Srpska survives under Serbian protection, while Bosnia and Herzegovina enter the new settlement. Victory now brings a responsibility to rebuild."
 MSGA_postbosnia.1.a:0 "A new chapter begins."
 MSGA_postbosnia.2.t:0 "The Cost of Victory"
 MSGA_postbosnia.2.d:0 "Roads, factories and public services bear the cost of the war. Engineers are repairing the western regions and the protectorates. A six-month reconstruction programme will support their recovery."
 MSGA_postbosnia.2.a:0 "We will rebuild."
 MSGA_postbosnia.3.t:0 "A New Serbian Era"
 MSGA_postbosnia.3.d:0 "Kosovo and Bosnia have changed Serbia’s position. The army must learn, the government must consolidate and the economy must recover. All three tasks now stand before Belgrade."
 MSGA_postbosnia.3.a:0 "Begin the transformation."
 MSGA_postbosnia.4.t:0 "Lessons Written in Blood"
 MSGA_postbosnia.4.d:0 "Staff officers examine the fighting across the Drina. Better planning and cooperation will matter more than another victory parade. The lessons will guide training and doctrine."
 MSGA_postbosnia.4.a:0 "Learn from the campaign."
 MSGA_postbosnia.5.t:0 "Territorial Militias for Bosnia"
 MSGA_postbosnia.5.d:0 "Two Bosnian territorial brigades have been organised for local security and service alongside the Serbian army. Their equipment is simple; their mission is to hold roads, settlements and supply routes."
 MSGA_postbosnia.5.a:0 "Place them under Serbian command."
 MSGA_postbosnia.6.t:0 "Territorial Militias for Herzegovina"
 MSGA_postbosnia.6.d:0 "Two Herzegovinian territorial brigades have entered service. They retain their regional names and serve directly under Serbian command, allowing Belgrade to coordinate their deployment."
 MSGA_postbosnia.6.a:0 "Secure the western approaches."
 MSGA_postbosnia.7.t:0 "The Srpska Territorial Defence"
 MSGA_postbosnia.7.d:0 "The new Srpska formation follows the Kosovo brigade model: mobile militia, mechanised troops, APCs and a small reserve tank support element. Serbian command will retain the unit whatever Srpska’s constitutional future."
 MSGA_postbosnia.7.a:0 "A lasting investment in defence."
 MSGA_postbosnia.8.t:0 "Victory Strengthens Belgrade"
 MSGA_postbosnia.8.d:0 "Victory has strengthened the presidency’s position. The government seeks to turn public confidence into stable institutions and lasting authority."
 MSGA_postbosnia.8.a:0 "Consolidate the victory."
 MSGA_postbosnia.9.t:0 "Bind the New Protectorates"
 MSGA_postbosnia.9.d:0 "Belgrade and the remaining protectorates establish common political and commercial arrangements. These agreements concern the subjects that still exist; Srpska’s annexation will not interrupt them."
 MSGA_postbosnia.9.a:0 "Build dependable ties."
 MSGA_postbosnia.10.t:0 "From War to Reconstruction"
 MSGA_postbosnia.10.d:0 "Emergency spending gives way to economic recovery. Debt relief, industrial development and a modest income programme begin the transition to a sustainable peace."
 MSGA_postbosnia.10.a:0 "Restore the war economy."
 MSGA_postbosnia.11.t:0 "Factories for Peace"
 MSGA_postbosnia.11.d:0 "New civilian factories and an office park turn wartime mobilisation toward employment and commerce. Their value will be measured in production and reliable livelihoods."
 MSGA_postbosnia.11.a:0 "Build for peace."
 MSGA_postbosnia.13.t:0 "One Serbian State"
 MSGA_postbosnia.13.d:0 "Republika Srpska has joined Serbia. Its territory and military formations pass to Belgrade, alongside one billion dollars of additional national debt. Administrative integration will take time."
 MSGA_postbosnia.13.a:0 "One state, with new responsibilities."
 MSGA_postbosnia.14.t:0 "Belgrade at the Centre"
 MSGA_postbosnia.14.d:0 "Political cooperation, trade and security now tie the remaining protectorates to Belgrade. Serbia’s influence rests on these practical connections."
 MSGA_postbosnia.14.a:0 "Strengthen the Serbian sphere."
 MSGA_postbosnia.15.t:0 "The Economic Heart of the Balkans"
 MSGA_postbosnia.15.d:0 "Industrial recovery and commercial investment have strengthened Serbia’s economy. Belgrade aims to become the region’s dependable centre for production and trade."
 MSGA_postbosnia.15.a:0 "Prosperity must sustain our influence."
 MSGA_postbosnia.16.t:0 "Serbia: A Regional Power"
 MSGA_postbosnia.16.d:0 "The military, political and economic programmes are complete. Serbia has emerged from the wars with a stronger state and a wider regional role. The task now is to sustain that position."
 MSGA_postbosnia.16.a:0 "A new regional power."
 MSGA_postbosnia.12.t:0 "The Question of Republika Srpska"
 MSGA_postbosnia.12.d:0 "One hundred days after the settlement, Belgrade must choose Srpska’s future. Unification transfers its territory and military forces to Serbia and adds $1B national debt. It grants no new Serbian cores."
 MSGA_postbosnia.12.a:0 "Unite Republika Srpska with Serbia"
 MSGA_postbosnia.12.b:0 "Preserve the Current Arrangement"
 MSGA_post_bosnia_auxiliaries:0 "Territorial Forces of the Serbian Sphere"
 MSGA_organise_bosnian_territorial_militias:0 "Organise Bosnian Territorial Militias"
 MSGA_organise_bosnian_territorial_militias_desc:0 "Spend 25 PP and $0.25B treasury to organise two three-battalion Bosnian militia brigades. They muster in Belgrade under Serbian command. Bosnia must remain a Serbian subject."
 MSGA_organise_herzegovinian_territorial_militias:0 "Organise Herzegovinian Territorial Militias"
 MSGA_organise_herzegovinian_territorial_militias_desc:0 "Spend 25 PP and $0.25B treasury to organise two three-battalion Herzegovinian militia brigades. They muster in Belgrade under Serbian command. Herzegovina must remain a Serbian subject."
 MSGA_form_srpska_territorial_defence:0 "Form the Srpska Territorial Defence"
 MSGA_form_srpska_territorial_defence_desc:0 "Spend $0.5B treasury and no PP to form Srpska Teritorijalna Odbrana. The formation has the Kosovo brigade’s mobile militia, IFV/APC and tank-support structure. Serbia commands it and keeps it after annexation. Available while Srpska is a Serbian puppet or after its approved unification."
 MSGA_cost_quarter_billion:0 "§Y$0.25B§!"
 MSGA_cost_half_billion:0 "§Y$0.5B§!"
 MSGA_bosnian_lessons_bonus:0 "Lessons of the Bosnian War"
 MSGA_bosnian_war_lessons:0 "Lessons Written in Blood"
