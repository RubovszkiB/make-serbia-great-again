 MSGA_bound_protectorate:0 "Bound to Belgrade"
 MSGA_integrated_protectorate:0 "The Serbian Sphere"
 MSGA_postwar_income_recovery:0 "Postwar Income Recovery"
 MSGA_economic_heart_spirit:0 "Economic Heart of the Balkans"
 MSGA_regional_power_prestige:0 "A Regional Power"
 MSGA_western_reconstruction:0 "Western Reconstruction"
 MSGA_postwar_cooperation:0 "Postwar Cooperation"
 MSGA_bosnian_war_lessons_desc:0 "The postwar programme strengthens cooperation, recovery and regional influence."
 MSGA_serbian_sphere_spirit_desc:0 "The postwar programme strengthens cooperation, recovery and regional influence."
 MSGA_bound_protectorate_desc:0 "The postwar programme strengthens cooperation, recovery and regional influence."
 MSGA_integrated_protectorate_desc:0 "The postwar programme strengthens cooperation, recovery and regional influence."
 MSGA_postwar_income_recovery_desc:0 "The postwar programme strengthens cooperation, recovery and regional influence."
 MSGA_economic_heart_spirit_desc:0 "The postwar programme strengthens cooperation, recovery and regional influence."
 MSGA_regional_power_prestige_desc:0 "The postwar programme strengthens cooperation, recovery and regional influence."
 MSGA_post_bosnia_auxiliaries_desc:0 "Organise regional territorial troops under Serbian command. Each formation can be raised once; the Srpska formation remains available after approved unification."
