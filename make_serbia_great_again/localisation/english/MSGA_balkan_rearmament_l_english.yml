l_english:
 MSGA_CRO_light_infantry:0 "Croatian Light Infantry"
 MSGA_ALB_a_vulnerable_nation_reward_tt:0 "+5% War Support, +25 Political Power, +5 Army Experience and $1B Treasury assistance. Opens early procurement."
 MSGA_ALB_a_vulnerable_nation_contracts_tt:0 "Unlocks one-time contracts: Purchase Old Eastern Rifles."
 MSGA_ALB_a_vulnerable_nation:0 "A Vulnerable Nation"
 MSGA_ALB_a_vulnerable_nation_desc:0 "Albania cannot match its neighbours through prestige projects. Limited Treasury assistance and access to old equipment will support a small, defensible army."
 MSGA_ALB_open_the_surplus_markets_reward_tt:0 "Adds Surplus Procurement Network: +1% Income Growth, +2% Business Value and +2% Factory Output."
 MSGA_ALB_open_the_surplus_markets_contracts_tt:0 "Unlocks one-time contracts: Acquire Old Mortars, Buy Used Military Trucks."
 MSGA_ALB_open_the_surplus_markets:0 "Open the Surplus Markets"
 MSGA_ALB_open_the_surplus_markets_desc:0 "A modest procurement network will seek affordable equipment in old depots. Each negotiated contract can be purchased once."
 MSGA_ALB_empty_the_old_depots_reward_tt:0 "Receive 1,500 older rifles, 60 older artillery and 75 Support Equipment."
 MSGA_ALB_empty_the_old_depots:0 "Empty the Old Depots"
 MSGA_ALB_empty_the_old_depots_desc:0 "Old rifles, artillery and support equipment will fill the gaps in our battalions without an expensive programme of modernisation."
 MSGA_ALB_expand_military_workshops_reward_tt:0 "Add one Military Factory and one shared building slot in Albania. +5% Military Factory Construction Speed for 180 days."
 MSGA_ALB_expand_military_workshops:0 "Expand Military Workshops"
 MSGA_ALB_expand_military_workshops_desc:0 "Expand our existing workshops with one military factory and an additional shared building slot. Construction support lasts 180 days."
 MSGA_ALB_domestic_ammunition_reward_tt:0 "+5% Factory Output for 180 days. Receive 25 Support Equipment."
 MSGA_ALB_domestic_ammunition:0 "Domestic Ammunition"
 MSGA_ALB_domestic_ammunition_desc:0 "A modest Albanian programme supporting domestic ammunition."
 MSGA_ALB_weapons_for_every_battalion_reward_tt:0 "+5% Division Organisation and +5 percentage points Reinforce Rate until Armed Albania replaces this programme."
 MSGA_ALB_weapons_for_every_battalion_tier_tt:0 "Opens the second stage of Albanian procurement."
 MSGA_ALB_weapons_for_every_battalion:0 "Weapons for Every Battalion"
 MSGA_ALB_weapons_for_every_battalion_desc:0 "Organise the available stock around complete battalions, improving readiness and opening the next stage of procurement."
 MSGA_ALB_look_to_ankara_reward_tt:0 "Open the one-time Turkish small-arms and armoured-vehicle contracts."
 MSGA_ALB_look_to_ankara_contracts_tt:0 "Unlocks one-time contracts: Turkish Small Arms Contract, Purchase Turkish Armoured Vehicles."
 MSGA_ALB_look_to_ankara:0 "Look to Ankara"
 MSGA_ALB_look_to_ankara_desc:0 "Negotiate one-time Turkish small-arms and armoured-vehicle contracts. Equipment must be paid for and arrives after the agreed delivery period."
 MSGA_ALB_secure_foreign_stockpiles_reward_tt:0 "+$0.5B Treasury assistance and access to a one-time modern anti-tank contract."
 MSGA_ALB_secure_foreign_stockpiles_contracts_tt:0 "Unlocks one-time contracts: Acquire Modern AT Weapons."
 MSGA_ALB_secure_foreign_stockpiles:0 "Secure Foreign Stockpiles"
 MSGA_ALB_secure_foreign_stockpiles_desc:0 "Modest financial assistance and access to foreign stores will make a later anti-tank contract possible."
 MSGA_ALB_armed_albania_reward_tt:0 "Replace Battalion Readiness with Armed Albania: +5% Division Defence, +5% Organisation and +5% Mobilisation Speed."
 MSGA_ALB_armed_albania:0 "Armed Albania"
 MSGA_ALB_armed_albania_desc:0 "A modest Albanian programme supporting armed albania."
 MSGA_CRO_business_as_usual_reward_tt:0 "+40 Political Power, +2% Stability and +1% Income Growth for 180 days."
 MSGA_CRO_business_as_usual:0 "Business as Usual"
 MSGA_CRO_business_as_usual_desc:0 "Croatia will maintain ordinary government and stable economic relations while the regional situation remains calm."
 MSGA_CRO_support_hs_produkt_reward_tt:0 "+1 shared building slot in Croatia Proper and +2% Factory Output."
 MSGA_CRO_support_hs_produkt:0 "Support HS Produkt"
 MSGA_CRO_support_hs_produkt_desc:0 "Support our arms manufacturer with additional industrial space and a modest production programme."
 MSGA_CRO_export_contracts_reward_tt:0 "Adds Croatian Arms Exports: +3% Factory Output, +2% Income Growth and +5% Business Value."
 MSGA_CRO_export_contracts:0 "Export Contracts"
 MSGA_CRO_export_contracts_desc:0 "Croatian arms exports will support industrial output, income growth and business confidence."
 MSGA_CRO_maintain_readiness_reward_tt:0 "+5 Army Experience, +2.5% War Support and 5% shorter army training time."
 MSGA_CRO_maintain_readiness:0 "Maintain Readiness"
 MSGA_CRO_maintain_readiness_desc:0 "Maintain staff experience, public readiness and efficient training without an emergency mobilisation."
 MSGA_CRO_modernise_the_army_reward_tt:0 "Receive 50 Support Equipment and one 50% research bonus for Infantry Weapons."
 MSGA_CRO_modernise_the_army:0 "Modernise the Army"
 MSGA_CRO_modernise_the_army_desc:0 "Supply the existing army and support one round of infantry-weapons research."
 MSGA_CRO_a_stable_croatia_reward_tt:0 "+5% Stability and +3% Factory Output."
 MSGA_CRO_a_stable_croatia:0 "A Stable Croatia"
 MSGA_CRO_a_stable_croatia_desc:0 "A stable government and a modest industrial programme provide a peaceful foundation for Croatia."
 MSGA_CRO_aggressive_rearmament_reward_tt:0 "+10% War Support. Opens the emergency military branch after Serbia enters the Bosnian war."
 MSGA_CRO_aggressive_rearmament:0 "Aggressive Rearmament"
 MSGA_CRO_aggressive_rearmament_desc:0 "Serbia has entered the Bosnian conflict. Croatia must begin serious military preparation in response to that escalation."
 MSGA_CRO_emergency_defence_budget_reward_tt:0 "+1 Military Factory and +2 shared building slots in Croatia Proper. +5% Military Factory Construction Speed for 180 days."
 MSGA_CRO_emergency_defence_budget:0 "Emergency Defence Budget"
 MSGA_CRO_emergency_defence_budget_desc:0 "Establish one military factory and two shared building slots, supported by a 180-day military-construction programme."
 MSGA_CRO_expand_hs_produkt_reward_tt:0 "+1 Military Factory in Croatia Proper. Receive 1,200 service rifles."
 MSGA_CRO_expand_hs_produkt:0 "Expand HS Produkt"
 MSGA_CRO_expand_hs_produkt_desc:0 "Expand military manufacture and deliver 1,200 service rifles for Croatia’s own formations."
 MSGA_CRO_mass_arms_production_reward_tt:0 "Receive 2,200 service rifles, 120 Support Equipment and 60 Artillery."
 MSGA_CRO_mass_arms_production:0 "Mass Arms Production"
 MSGA_CRO_mass_arms_production_desc:0 "A concentrated delivery of rifles, support equipment and artillery will supply the growing army."
 MSGA_CRO_reactivate_duro_dakovic_reward_tt:0 "+1 Military Factory in Croatia Proper and one 50% research bonus for Armour."
 MSGA_CRO_reactivate_duro_dakovic:0 "Reactivate Đuro Đaković"
 MSGA_CRO_reactivate_duro_dakovic_desc:0 "Reactivate defence manufacture with one military factory and a single research bonus for armour."
 MSGA_CRO_armoured_modernisation_reward_tt:0 "Open the one-time American IFV and German Armour contracts."
 MSGA_CRO_armoured_modernisation_contracts_tt:0 "Unlocks one-time contracts: American IFV Package, German Armour Contract."
 MSGA_CRO_armoured_modernisation:0 "Armoured Modernisation"
 MSGA_CRO_armoured_modernisation_desc:0 "Open one-time contracts for American infantry fighting vehicles and German armour, preserving our existing formations."
 MSGA_CRO_western_procurement_reward_tt:0 "Open fixed-price Western procurement contracts. +1% Income Growth for 180 days."
 MSGA_CRO_western_procurement_contracts_tt:0 "Unlocks one-time contracts: NATO Small Arms Package, European Artillery Contract, Modern AT Package."
 MSGA_CRO_western_procurement:0 "Western Procurement"
 MSGA_CRO_western_procurement_desc:0 "Negotiate fixed-price Western small-arms, artillery and anti-tank contracts. A modest economic support programme lasts 180 days."
 MSGA_CRO_prepare_the_reserves_reward_tt:0 "+5% Recruitable Population Factor and +10% Mobilisation Speed."
 MSGA_CRO_prepare_the_reserves:0 "Prepare the Reserves"
 MSGA_CRO_prepare_the_reserves_desc:0 "Prepare the reserves through measured recruitment and improved mobilisation, without spawning free formations."
 MSGA_CRO_secure_slavonia_reward_tt:0 "+1 Infrastructure in Croatia Proper, up to its native maximum, and +2 land-fort levels in eastern Slavonia."
 MSGA_CRO_secure_slavonia:0 "Secure Slavonia"
 MSGA_CRO_secure_slavonia_desc:0 "Improve infrastructure in Croatia Proper and build two fort levels in its eastern Slavonian frontier province."
 MSGA_CRO_croatia_rearmed_reward_tt:0 "Adds Croatia Rearmed: +7.5% Factory Output, +5% Organisation, +5% Division Defence and +5% Production Efficiency Cap."
 MSGA_CRO_croatia_rearmed:0 "Croatia Rearmed"
 MSGA_CRO_croatia_rearmed_desc:0 "Croatia’s rearmament programme strengthens industrial output, organisation, defence and production efficiency."
 MSGA_ALB_procurement:0 "Albanian Military Procurement"
 MSGA_ALB_procurement_desc:0 "One-time equipment contracts. Treasury is reserved immediately; delivery occurs after the stated period. Only one shipment can be pending at a time. Cancelled shipments are refunded."
 MSGA_ALB_purchase_old_eastern_rifles:0 "Purchase Old Eastern Rifles"
 MSGA_ALB_purchase_old_eastern_rifles_desc:0 "Treasury: $0.4B. Delivery: 10 days. One-time only. 1800 infantry equipment Mk 1."
 MSGA_ALB_purchase_old_eastern_rifles_available_tt:0 "Requires A Vulnerable Nation, $0.4B Treasury, no other pending shipment, and a country that has not capitulated."
 MSGA_ALB_purchase_old_eastern_rifles_start_tt:0 "Reserve $0.4B Treasury for a one-time 10-day shipment. Cancellation refunds this amount."
 MSGA_ALB_purchase_old_eastern_rifles_finish_tt:0 "Receive 1800 infantry equipment Mk 1. This contract is permanently completed."
 MSGA_ALB_acquire_old_mortars:0 "Acquire Old Mortars"
 MSGA_ALB_acquire_old_mortars_desc:0 "Treasury: $0.5B. Delivery: 14 days. One-time only. 60 artillery equipment Mk 1, 40 support equipment Mk 1."
 MSGA_ALB_acquire_old_mortars_available_tt:0 "Requires Open the Surplus Markets, $0.5B Treasury, no other pending shipment, and a country that has not capitulated."
 MSGA_ALB_acquire_old_mortars_start_tt:0 "Reserve $0.5B Treasury for a one-time 14-day shipment. Cancellation refunds this amount."
 MSGA_ALB_acquire_old_mortars_finish_tt:0 "Receive 60 artillery equipment Mk 1, 40 support equipment Mk 1. This contract is permanently completed."
 MSGA_ALB_buy_used_military_trucks:0 "Buy Used Military Trucks"
 MSGA_ALB_buy_used_military_trucks_desc:0 "Treasury: $0.6B. Delivery: 14 days. One-time only. 120 motorized equipment Mk 1."
 MSGA_ALB_buy_used_military_trucks_available_tt:0 "Requires Open the Surplus Markets, $0.6B Treasury, no other pending shipment, and a country that has not capitulated."
 MSGA_ALB_buy_used_military_trucks_start_tt:0 "Reserve $0.6B Treasury for a one-time 14-day shipment. Cancellation refunds this amount."
 MSGA_ALB_buy_used_military_trucks_finish_tt:0 "Receive 120 motorized equipment Mk 1. This contract is permanently completed."
 MSGA_ALB_turkish_small_arms_contract:0 "Turkish Small Arms Contract"
 MSGA_ALB_turkish_small_arms_contract_desc:0 "Treasury: $0.9B. Delivery: 21 days. One-time only. 1600 infantry equipment Mk 3, 60 support equipment Mk 1."
 MSGA_ALB_turkish_small_arms_contract_available_tt:0 "Requires Look to Ankara, $0.9B Treasury, no other pending shipment, and a country that has not capitulated."
 MSGA_ALB_turkish_small_arms_contract_start_tt:0 "Reserve $0.9B Treasury for a one-time 21-day shipment. Cancellation refunds this amount."
 MSGA_ALB_turkish_small_arms_contract_finish_tt:0 "Receive 1600 infantry equipment Mk 3, 60 support equipment Mk 1. This contract is permanently completed."
 MSGA_ALB_acquire_modern_at_weapons:0 "Acquire Modern AT Weapons"
 MSGA_ALB_acquire_modern_at_weapons_desc:0 "Treasury: $1.1B. Delivery: 21 days. One-time only. 120 anti tank equipment Mk 2."
 MSGA_ALB_acquire_modern_at_weapons_available_tt:0 "Requires Secure Foreign Stockpiles, $1.1B Treasury, no other pending shipment, and a country that has not capitulated."
 MSGA_ALB_acquire_modern_at_weapons_start_tt:0 "Reserve $1.1B Treasury for a one-time 21-day shipment. Cancellation refunds this amount."
 MSGA_ALB_acquire_modern_at_weapons_finish_tt:0 "Receive 120 anti tank equipment Mk 2. This contract is permanently completed."
 MSGA_ALB_purchase_turkish_armoured_vehicles:0 "Purchase Turkish Armoured Vehicles"
 MSGA_ALB_purchase_turkish_armoured_vehicles_desc:0 "Treasury: $1.4B. Delivery: 30 days. One-time only. 60 light mechanized equipment Mk 2."
 MSGA_ALB_purchase_turkish_armoured_vehicles_available_tt:0 "Requires Look to Ankara, $1.4B Treasury, no other pending shipment, and a country that has not capitulated."
 MSGA_ALB_purchase_turkish_armoured_vehicles_start_tt:0 "Reserve $1.4B Treasury for a one-time 30-day shipment. Cancellation refunds this amount."
 MSGA_ALB_purchase_turkish_armoured_vehicles_finish_tt:0 "Receive 60 light mechanized equipment Mk 2. This contract is permanently completed."
 MSGA_CRO_procurement:0 "Croatian Military Procurement"
 MSGA_CRO_procurement_desc:0 "One-time equipment contracts. Treasury is reserved immediately; delivery occurs after the stated period. Only one shipment can be pending at a time. Cancelled shipments are refunded."
 MSGA_CRO_nato_small_arms_package:0 "NATO Small Arms Package"
 MSGA_CRO_nato_small_arms_package_desc:0 "Treasury: $1.2B. Delivery: 21 days. One-time only. 1800 infantry equipment Mk 3, 80 support equipment Mk 1."
 MSGA_CRO_nato_small_arms_package_available_tt:0 "Requires Western Procurement, $1.2B Treasury, no other pending shipment, and a country that has not capitulated."
 MSGA_CRO_nato_small_arms_package_start_tt:0 "Reserve $1.2B Treasury for a one-time 21-day shipment. Cancellation refunds this amount."
 MSGA_CRO_nato_small_arms_package_finish_tt:0 "Receive 1800 infantry equipment Mk 3, 80 support equipment Mk 1. This contract is permanently completed."
 MSGA_CRO_european_artillery_contract:0 "European Artillery Contract"
 MSGA_CRO_european_artillery_contract_desc:0 "Treasury: $1.4B. Delivery: 24 days. One-time only. 96 artillery equipment Mk 2."
 MSGA_CRO_european_artillery_contract_available_tt:0 "Requires Western Procurement, $1.4B Treasury, no other pending shipment, and a country that has not capitulated."
 MSGA_CRO_european_artillery_contract_start_tt:0 "Reserve $1.4B Treasury for a one-time 24-day shipment. Cancellation refunds this amount."
 MSGA_CRO_european_artillery_contract_finish_tt:0 "Receive 96 artillery equipment Mk 2. This contract is permanently completed."
 MSGA_CRO_american_ifv_package:0 "American IFV Package"
 MSGA_CRO_american_ifv_package_desc:0 "Treasury: $2.4B. Delivery: 35 days. One-time only. 70 mechanized equipment Mk 2."
 MSGA_CRO_american_ifv_package_available_tt:0 "Requires Armoured Modernisation, $2.4B Treasury, no other pending shipment, and a country that has not capitulated."
 MSGA_CRO_american_ifv_package_start_tt:0 "Reserve $2.4B Treasury for a one-time 35-day shipment. Cancellation refunds this amount."
 MSGA_CRO_american_ifv_package_finish_tt:0 "Receive 70 mechanized equipment Mk 2. This contract is permanently completed."
 MSGA_CRO_german_armour_contract:0 "German Armour Contract"
 MSGA_CRO_german_armour_contract_desc:0 "Treasury: $2.8B. Delivery: 45 days. One-time only. 40 modern tank equipment Mk 3. With No Step Back: 40 German Leopard 2A5 tanks, using the existing TFR design."
 MSGA_CRO_german_armour_contract_available_tt:0 "Requires Armoured Modernisation, $2.8B Treasury, no other pending shipment, and a country that has not capitulated. Germany must exist."
 MSGA_CRO_german_armour_contract_start_tt:0 "Reserve $2.8B Treasury for a one-time 45-day shipment. Cancellation refunds this amount."
 MSGA_CRO_german_armour_contract_finish_tt:0 "Receive 40 modern tank equipment Mk 3. This contract is permanently completed."
 MSGA_CRO_modern_at_package:0 "Modern AT Package"
 MSGA_CRO_modern_at_package_desc:0 "Treasury: $1.1B. Delivery: 21 days. One-time only. 120 anti tank equipment Mk 2."
 MSGA_CRO_modern_at_package_available_tt:0 "Requires Western Procurement, $1.1B Treasury, no other pending shipment, and a country that has not capitulated."
 MSGA_CRO_modern_at_package_start_tt:0 "Reserve $1.1B Treasury for a one-time 21-day shipment. Cancellation refunds this amount."
 MSGA_CRO_modern_at_package_finish_tt:0 "Receive 120 anti tank equipment Mk 2. This contract is permanently completed."
